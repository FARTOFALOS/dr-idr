<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1020" viewBox="0 0 1360 1020" role="img" aria-labelledby="title desc"><title id="title">Цена, место и выбор — смысловой контур DR Lab</title><desc id="desc">Сегодняшний график и задача трейдера определяют вопрос; сравнимая история даёт свидетельство; фиксированный выпуск связан с исходом той же цели для проверки. Схема показывает смысловые зависимости, а не разрешение на live-сбор данных.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#697686"/></marker></defs><rect width="1360" height="1020" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172b3c"><text x="60" y="42" font-size="27" font-weight="600">Цена, место и выбор</text><text x="60" y="69" font-size="16" fill="#53677b">Редакция 12.10.2026 · зависимости смысла, а не перечень сервисов</text></g><path d="M625 152 V175 H225 V205" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M625 152 V175 H1025 V205" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M225 291 V355" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M1025 291 V355" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M390 398 H460" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M860 398 H790" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M625 291 V355" fill="none" stroke="#697686" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M225 441 V505" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M625 441 V505" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M1025 441 V505" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M860 548 H790" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M460 548 H390" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M225 591 V655" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M625 591 V655" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M390 698 H460" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M790 698 H860" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M1025 655 V591" fill="none" stroke="#697686" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M625 741 V805" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M860 853 H790" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M460 853 H390" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M390 875 H427 V721 H460" fill="none" stroke="#697686" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M1190 386 H1230 V688 H1190" fill="none" stroke="#697686" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M1190 417 H1290 V853 H1190" fill="none" stroke="#697686" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M790 248 H1260 V531 H1190" fill="none" stroke="#697686" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/><g id="market"><rect x="460" y="90" width="330" height="62" rx="11" fill="#e9edf2" stroke="#91a0ae" stroke-width="1"/><text x="625" y="121" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Рыночный процесс</text></g><g id="historySource"><rect x="60" y="205" width="330" height="86" rx="11" fill="#eef3f8" stroke="#91a0ae" stroke-width="1"/><text x="225" y="236" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Историческая запись</text><text x="225" y="260" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">G3 • M5 • версии источника</text></g><g id="strategy"><rect x="460" y="205" width="330" height="86" rx="11" fill="#f7edda" stroke="#91a0ae" stroke-width="1"/><text x="625" y="236" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Стратегия DR/IDR</text><text x="625" y="260" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">рамка • события • гипотезы</text></g><g id="todaySource"><rect x="860" y="205" width="330" height="86" rx="11" fill="#e2f2ec" stroke="#91a0ae" stroke-width="1"/><text x="1025" y="236" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Сегодняшняя запись</text><text x="1025" y="260" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">TradingView • закрытые M5</text></g><g id="cases"><rect x="60" y="355" width="330" height="86" rx="11" fill="#eef3f8" stroke="#91a0ae" stroke-width="1"/><text x="225" y="386" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Исторические случаи</text><text x="225" y="410" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">свои рамки, пути и ID</text></g><g id="compat"><rect x="460" y="355" width="330" height="86" rx="11" fill="#f7edda" stroke="#91a0ae" stroke-width="1"/><text x="625" y="386" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Соизмеримость</text><text x="625" y="410" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">часы • серия • единицы</text></g><g id="cut"><rect x="860" y="355" width="330" height="86" rx="11" fill="#e2f2ec" stroke="#91a0ae" stroke-width="1"/><text x="1025" y="386" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Срез сегодня</text><text x="1025" y="410" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">цена • статус • известный контекст</text></g><g id="outcomes"><rect x="60" y="505" width="330" height="86" rx="11" fill="#eef3f8" stroke="#91a0ae" stroke-width="1"/><text x="225" y="536" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Исходы случаев</text><text x="225" y="560" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">результат • время • неизвестное</text></g><g id="question"><rect x="460" y="505" width="330" height="86" rx="11" fill="#e9e5f5" stroke="#91a0ae" stroke-width="1"/><text x="625" y="536" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Вопрос и сравнение</text><text x="625" y="560" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">место • якорь • горизонт • опора</text></g><g id="work"><rect x="860" y="505" width="330" height="86" rx="11" fill="#f7edda" stroke="#91a0ae" stroke-width="1"/><text x="1025" y="536" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Трейдер и задача</text><text x="1025" y="560" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">цель • опыт • гипотеза</text></g><g id="evidence"><rect x="60" y="655" width="330" height="86" rx="11" fill="#eef3f8" stroke="#91a0ae" stroke-width="1"/><text x="225" y="686" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Историческое свидетельство</text><text x="225" y="710" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">доля • распределение • опора</text></g><g id="answer"><rect x="460" y="655" width="330" height="86" rx="11" fill="#e9e5f5" stroke="#91a0ae" stroke-width="1"/><text x="625" y="686" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Ответ для текущей работы</text><text x="625" y="710" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">логика • история • прогноз*</text></g><g id="choice"><rect x="860" y="655" width="330" height="86" rx="11" fill="#f7edda" stroke="#91a0ae" stroke-width="1"/><text x="1025" y="686" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Восприятие и выбор</text><text x="1025" y="710" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">график + ответ + личное суждение</text></g><g id="validation"><rect x="60" y="805" width="330" height="96" rx="11" fill="#e2f2ec" stroke="#91a0ae" stroke-width="1"/><text x="225" y="829" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Проверка вида ответа</text><text x="225" y="853" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">калибровка • сравнение</text><text x="225" y="877" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">область применимости</text></g><g id="issue"><rect x="460" y="805" width="330" height="96" rx="11" fill="#e9e5f5" stroke="#91a0ae" stroke-width="1"/><text x="625" y="841" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Фиксированный выпуск</text><text x="625" y="865" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">цель • срез • версия • значение</text></g><g id="realized"><rect x="860" y="805" width="330" height="96" rx="11" fill="#e2f2ec" stroke="#91a0ae" stroke-width="1"/><text x="1025" y="841" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172b3c">Исход той же цели</text><text x="1025" y="865" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477">позже становится известен</text></g><g font-family="Segoe UI,Arial,sans-serif" fill="#526477" font-size="14"><text x="1242" y="619" transform="rotate(-90 1242 619)">живой график</text><text x="1305" y="701" transform="rotate(-90 1305 701)">следующие наблюдения</text><text x="1274" y="334" transform="rotate(-90 1274 334)">гипотезы метода</text><text x="60" y="944">* Прогноз — только при адресной проверке и допуске. Необычность, опора и проверенность различаются.</text><text x="60" y="970">Петля проверки работает для определённых выпусков и целей. Новый live-журнал и пополнение истории не включаются автоматически.</text><text x="60" y="995">Основной контекст человека — сегодняшний график; история добавляет измеримое свидетельство.</text></g></svg>
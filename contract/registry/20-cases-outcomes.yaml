regions:
  - {id: REG:WHOLE-1, version: "1", sc_ref: ["P2"], grounds: DR_LAB_DECISION, region_kind: WHOLE_DISTRIBUTION, grid: GRID:K10-J15-1, bounds_rule: "every cell of the event's table (its own 100 % with the unknown mass)", origin: WHOLE}
  - {id: REG:PRICE-BAND-1, version: "1", sc_ref: ["P2", "K17"], grounds: DR_LAB_DECISION, region_kind: PRICE_BAND, grid: GRID:K10-J15-1, bounds_rule: "price cells k0 <= k < k1, unbounded in time (never the time bounds of a drawn core)", origin: OPERATOR_SELECTION}
  - {id: REG:TIME-WINDOW-1, version: "1", sc_ref: ["P2"], grounds: DR_LAB_DECISION, region_kind: TIME_WINDOW, grid: GRID:K10-J15-1, bounds_rule: "time cells b0 <= b < b1 of the event's first M5, all prices", origin: FIXED_GRID}
  - {id: REG:JOINT-1, version: "1", sc_ref: ["P2", "K17"], grounds: DR_LAB_DECISION, region_kind: JOINT_PRICE_TIME, grid: GRID:K10-J15-1, bounds_rule: "cells with k0 <= k < k1 and b0 <= b < b1; its share never exceeds its band's", origin: OPERATOR_SELECTION}
  - {id: REG:ZONE-MASK-1, version: "1", sc_ref: ["P2", "P3"], grounds: DR_LAB_DECISION, region_kind: ZONE_MASK, grid: GRID:K10-J15-1, bounds_rule: "the zone's exact cell mask; its bounding box is a drawing, not membership", origin: ALGORITHM, density_algorithm: ALG:ZONE-MAP-3}
  - {id: REG:RESIDUAL-1, version: "1", sc_ref: ["P2", "P3"], grounds: DR_LAB_DECISION, region_kind: RESIDUAL_OUTSIDE_ZONES, grid: GRID:K10-J15-1, bounds_rule: "every known event outside all zones of the map", origin: ALGORITHM, density_algorithm: ALG:ZONE-MAP-3}
  - {id: REG:UNDETERMINED-1, version: "1", sc_ref: ["P2", "V2.1"], grounds: DR_LAB_DECISION, region_kind: UNDETERMINED_MASS, bounds_rule: "UNKNOWN and NO_PERIOD cases: kept in N, given no coordinate", origin: WHOLE}
  - {id: REG:OUT-OF-FRAME-1, version: "1", sc_ref: ["P2"], grounds: IMPLEMENTATION_FACT, region_kind: OUT_OF_FRAME, grid: GRID:K10-J15-1, bounds_rule: "price cells above (or below) the visible price range of the chart at that moment; the region is the frame's, the count is the family's", origin: SCREEN_FRAME}
  - {id: REG:LEVEL-1, version: "1", sc_ref: ["P2", "P0.2"], grounds: DR_LAB_DECISION, region_kind: LEVEL, bounds_rule: "u >= L along when L > 0, u <= L against when L <= 0, L = a / b exact (today's level in the snapshot's scale)", origin: TODAY_LEVEL}
  - {id: REG:M5-CELL-1, version: "1", sc_ref: ["P2", "§12.4/B-CLOSE"], grounds: DR_LAB_DECISION, region_kind: M5_CELL, grid: GRID:K10-J15-1, bounds_rule: "price cell k on one common clock M5 j", origin: FIXED_GRID}
  - {id: REG:NONE-1, version: "1", sc_ref: ["P2"], grounds: DR_LAB_DECISION, region_kind: NONE, bounds_rule: "no region: a category or a residual question of a whole set", origin: WHOLE}

density_algorithms:
  - id: ALG:ZONE-MAP-3
    version: "zone-map-3"
    sc_ref: ["P3"]
    grounds: DR_LAB_DECISION
    title_ru: карта зон zone-map-3
    grid: GRID:K10-J15-1
    density_rule: "D(cell) = the number of the family's known events of one kind in the 3 x 3 cells around the cell, at every cell, empty ones included"
    region_rule: "a zone is a connected (8-neighbourhood) region whose D is at least half of the region's own maximum and which holds no cell above it: the half-height region of its own apex; regions never overlap and need no tie-break"
    min_support_rule: "n_zone >= max(4, ceil(0.05 N)); otherwise its sessions stay in the residual; share = n_zone / N_base"
    order_rule: "by start time, then share, then nearness to u = 0; label E1, E2 … in that order"
    diagnostics: ["grid shifts: half a price cell, 5 and 10 minutes, Jaccard of member sets", "50 resamplings of sessions, mean Jaccard and share >= 0.5", "held-out path-null: the older half finds the region, the newer half against 200 sign-flipped copies of its own paths (sign-flip-1)"]
    seed_rule: "every random procedure seeded from the version, the family, the snapshot, the event and the test"
    frozen: true
    source_refs: [SRC:M12, SRC:CODE-ZONEMAP24]

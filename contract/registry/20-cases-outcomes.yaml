# DR-LAB-SC-1.1 registry · layers 4-5: case-set rules, state comparisons, outcome projections, regions, the zone
# algorithm. Each OutcomeSpecification names its reference definition in lab/contract.py (the executable form of
# this definition, versioned with it) and the production implementations the gate compares against it.
registry_part: layers-4-5


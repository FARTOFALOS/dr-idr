comparisons:
  - id: CMP:B0-1
    version: "1.0"
    sc_ref: ["H3", "§12.2"]
    grounds: OPERATOR_REQUIREMENT
    title_ru: B0 — только время после активации, без сравнения цены и пути
    alignment: COMMON_SESSION_CLOCK
    features: ["none: every eligible member at the same clock cut ET"]
    feature_availability: PREFIX_AT_CUT
    frozen: true
    weights: NONE
    source_refs: [SRC:NOW-1.0]
  - id: CMP:M1-1
    version: "1.0"
    sc_ref: ["H3", "§12.2"]
    grounds: OPERATOR_REQUIREMENT
    title_ru: M1 — тот же экстремум
    alignment: COMMON_SESSION_CLOCK
    features: ["R: r_seen; X: x_seen (own extremes after the own activation up to t, in own IDR widths)"]
    feature_availability: PREFIX_AT_CUT
    tolerance: "|a / w_a - b / w_b| <= 1/4 inclusive, exact in integers: 4 |a w_b - b w_a| <= w_a w_b"
    frozen: true
    weights: NONE
    source_refs: [SRC:NOW-1.0, SRC:CODE-NOW24]
  - id: CMP:M2-1
    version: "1.0"
    sc_ref: ["H3", "§12.2"]
    grounds: OPERATOR_REQUIREMENT
    title_ru: M2 — то же состояние
    alignment: COMMON_SESSION_CLOCK
    features: ["r_seen and x_seen together"]
    feature_availability: PREFIX_AT_CUT
    tolerance: "both M1 constraints"
    frozen: true
    weights: NONE
    source_refs: [SRC:NOW-1.0]
  - id: CMP:M3-1
    version: "1.0"
    sc_ref: ["H3", "§12.2"]
    grounds: OPERATOR_REQUIREMENT
    title_ru: M3 — тот же недавний путь
    alignment: COMMON_SESSION_CLOCK
    features: ["M2", "the closes of the last n = min(6, today's M5 after its activation) common clock M5, n >= 3, all after the member's own activation"]
    feature_availability: PREFIX_AT_CUT
    tolerance: "mean |close difference| <= 0.20 and max <= 0.35 IDR width, exact in integers"
    frozen: true
    weights: NONE
    source_refs: [SRC:NOW-1.0, SRC:CODE-NOW24]


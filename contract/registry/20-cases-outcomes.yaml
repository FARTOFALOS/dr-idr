    condition_availability: AT_ACTIVATION
    live_use: PERMITTED
    profile: PROFILE:BASE-24
    source_refs: [SRC:CODE-BUILD-BOXES, SRC:AGENTS]
  - id: CS:F-CONF-1
    version: "1"
    sc_ref: ["H1", "§12.1"]
    grounds: OPERATOR_REQUIREMENT

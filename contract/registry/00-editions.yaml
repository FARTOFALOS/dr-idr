# DR-LAB-SC-1.1 registry · editions, the acceptance on record, profiles, source references.
# Instance data of contract/schema/dr_lab_sc.yaml (class Registry). The contract text is the source of truth; this
# file records which edition is in force for this work, on what human act, and where every definition comes from.
registry_part: editions-and-sources

editions:
  - id: DR-LAB-SC-1.0
    version: "1.0"
    sc_ref: ["§0.2"]
    grounds: CONTRACT_FORMALISATION
    title_ru: DR-LAB Semantic Contract 1.0
    document_path: spec/DR-LAB-Semantic-Contract-1.0.md
    document_sha256_lf: 2a7bcee886642117e3fc36ad25b9fb4b0ed4bd2f812128f73bdd16365a5f0ae6
    edition_status: PREVIOUS_EDITION
    source_refs: [SRC:SC-1.0]
    note: >-
      The previous edition kept for traceability (§0.2). It was absent from the working tree when this work began
      (the uncommitted node of meaning/07 linked to it); the operator restored the file into spec/ on 2026-10-07.
      K01-K32; 1.1 adds K33 and the three patches of §0.4.
  - id: DR-LAB-SC-1.1
    version: "1.1"
    sc_ref: ["§0.2", "§0.4", "§14.3"]
    grounds: CONTRACT_FORMALISATION
    title_ru: DR-LAB Semantic Contract 1.1 (patched)
    document_path: spec/DR-LAB-Semantic-Contract-1.1-(patched).md
    document_sha256_lf: 3572408e0cd91147ebe76056612ecae1bf8f8abc20203cedb5f033e94e09b775
    edition_status: ACCEPTED_FOR_PROFILES
    supersedes: DR-LAB-SC-1.0
    source_refs: [SRC:SC-1.1, SRC:GOAL-2026-10-07]
    acceptances:
      - actor_role: OPERATOR
        channel: Claude Code chat with the operator, 2026-10-07 (his direct message; Section A of his instructions)
        date: "2026-10-07"
        quote:
          - "Transform DR/IDR Lab into a system where the accepted `DR-LAB-SC-1.1` semantic contract is represented and enforced in machine-readable form"
          - "The attached `DR-LAB-Semantic-Contract-1.1-(patched).md` is the authoritative semantic target for this work."
          - "existing protected meanings remain unchanged unless the contract itself requires a correction"
          - "LinkML is an implementation instrument for that target, not a source of new domain meaning"
        scope: >-
          DR-LAB-SC-1.1 is the binding semantic target of the machine formalisation and its enforcement in DR/IDR Lab:
          the profiles BASE-24 and NOW-1.0 of branch design-24, their API and the working screen 24, including the
          corrections the contract itself requires (for example K33).
        exclusions:
          - merging design-24 into main, publication or a push (AGENTS.md; SC-1.1 §14.3)
          - any trading policy, order or execution (SC-1.1 §11, D1)
          - opening the 2026 tape or a prospective log (AGENTS.md rule 2; SC-1.1 §0.2)
          - a new NOW matcher, new thresholds or gates (NOW-1.0 frozen; SC-1.1 §12.2)
          - redrawing the screen beyond what the contract requires (meaning/13; operator 2026-09-30)
        not_established:
          - >-
            Acceptance of SC-1.1 as the general normative base of the whole project beyond this work: §14.3 asks for a
            human decision naming the edition and its scope; the scope named in the message is "this work".
          - Ratification of each normative position of SC-1.1 as a separate project standard.
      - actor_role: OPERATOR
        channel: Claude Code chat with the operator, 2026-10-07 (his direct message after the work was reported)
        date: "2026-10-07"
        quote:
          - "Принимаю SC-1.1 как нормативный семантический контракт для рабочего профиля DR Lab 24 (BASE-24 и NOW-1.0) и дальнейших изменений этих профилей; legacy-поверхности пока остаются вне него."
          - "Для NOW используй формулировки «В истории: R позже углублялся… / Если углублялся…» и симметрично для X."
        scope: >-
          DR-LAB-SC-1.1 is the normative semantic contract of the working profile DR Lab 24 — BASE-24 and NOW-1.0 — and of
          every further change of these profiles. The NOW words are the operator's.
        exclusions:
          - the legacy surfaces (design 22 at /22/, the classic screen, the research dashboard, /sem-v1/) stay outside it for now
          - any trading policy, order or execution (SC-1.1 §11, D1)
        not_established:
          - SC-1.1 for the legacy surfaces and for the project beyond the profiles named
      - actor_role: OPERATOR
        channel: Claude Code chat with the operator, 2026-10-07 (his next message)
        date: "2026-10-07"
        quote:
          - "Давай лучше сделай это как основная линия DR-Lab, то есть закоммуть, за, за, слей в main. Я принимаю решение слить все-таки PR"
        scope: >-
          The branch design-24 (PR #1) with this work is merged into main: screen 24 under SC-1.1 becomes the main line
          of DR Lab.
        exclusions:
          - any trading policy, order or execution (SC-1.1 §11, D1)
        not_established:
          - "the rewritten texts of hard rules 6 and 10 of AGENTS.md for main (AGENTS.md: «rewritten with the merge into main, with the operator»)"
      - actor_role: OPERATOR
        channel: >-
          Claude Code chat with the operator, 2026-10-08 11:55 UTC: his choice among the options of the executor's
          question «Проверка полноты закрыта … Как дальше?» (the option «Реализовать в отдельной ветке»; the option text
          below was written by the executor and chosen by him)
        date: "2026-10-08"
        quote:
          - "Разрешаю менять SC-1.1 и SWPC и собрать вариант для моей приёмки; рабочий экран до приёмки не трогать"
        scope: >-
          Changes of SC-1.1 and SWPC-1.1 that implement his decisions of 2026-10-08 (meaning/17 §7), on the branch
          resheniya-08-10, built as a variant for his acceptance: the profile PRE-24, the phase rule, the words of the NOW
          pullback line, «мало сессий» for small sets.
        exclusions:
          - the working screen (the swpc-1.1 candidate on port 8767 and main) until his acceptance
          - merging into main, publication or a push
          - any trading policy, order or execution (SC-1.1 §11, D1)
        not_established:
          - the acceptance of the variant itself — his separate act after he has seen it
          - the panel words proposed by the executor for these decisions (forms marked PROPOSED_BY_EXECUTOR)
        # these records preserve evidence of the acts; they do not create the decisions (SC-1.1 §14.1)

profiles:
  - id: PROFILE:BASE-24
    version: "24.1"
    sc_ref: ["§12.1"]
    grounds: DR_LAB_DECISION
    title_ru: базовая карта экрана 24
    edition: DR-LAB-SC-1.1
    profile_status: ACTIVE
    source_refs: [SRC:SEM-1.0, SRC:M10-P, SRC:M12, SRC:NOW-1.0, SRC:SEMANTICS-24, SRC:EKRAN-24, SRC:OPERATOR-ATOM-2026-10-01]
    note: >-
      Before a confirmation there is no directed family. After it F, N, own R / X of every member and their
      distributions are fixed; the slice changes today's facts, reachability, the history clock and the named residual
      questions only. After a break the break family F_break is a separate profile with a way back.
  - id: PROFILE:NOW-1.0
    version: "1.0"
    sc_ref: ["§12.2"]
    grounds: OPERATOR_REQUIREMENT
    title_ru: условный слой «Сейчас»
    edition: DR-LAB-SC-1.1
    profile_status: FROZEN
    source_refs: [SRC:NOW-1.0, SRC:M15, SRC:NOW-PROVERKA]
    note: Matchers, thresholds and gates frozen; a new matcher needs a new specification version.
  - id: PROFILE:PRE-24
    version: "1.0"
    sc_ref: ["§12.5"]
    grounds: OPERATOR_REQUIREMENT
    title_ru: второй экран до подтверждения
    edition: DR-LAB-SC-1.1
    profile_status: ACTIVE
    source_refs: [SRC:DECISIONS-2026-10-08, SRC:SEMANTICS-22, SRC:CODE-PRE24]
    note: >-
      Before today's confirmation there is still no directed base family (§12.1). PRE-24 is a separate set at the
      common clock cut: similar sessions by box colour, models of the day and price position (the operator's selection
      of 2026-10-08 with the definitions of design 22), never widened; fewer than 20 are shown with «мало сессий».
      Every number is C1. Built on the branch resheniya-08-10 for the operator's acceptance; not yet accepted by him.


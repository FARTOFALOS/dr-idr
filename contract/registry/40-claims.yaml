# DR-LAB-SC-1.1 registry · layer 8: the explicit claim forms (what may be said about each estimand, in which class and
# words) and the fact forms (observed facts, no claim class, no percentage). The runtime computes which claim classes
# the evidence admits and refuses to publish a form outside that set (lab/contract.py::admissible_claims).
#
# Labels are the exact words the page shows next to a number, per surface; placeholders {name} are filled with values
# (a value may carry its own markup, such as the coloured event letter). The page renders only these labels
# (design/sozvezdiya-24/src: L(), FX()) and tests/ui_check24.js compares the visible words with them. Forms marked
# INHERITED_FROM_ACCEPTED_SCREEN keep the words of the screen the operator accepted; PROPOSED_BY_EXECUTOR marks the
# words this work had to change because the contract requires it (K33: the NOW block in historical grammar).
# There is no PredictiveAdmission, no PolicySpecification and no ActionAuthorityReference in this edition: no C2 and no
# C3 claim is admissible anywhere (K28, K32, K33).
registry_part: layer-8

claim_forms:
  # =================================================================== BASE-24 (C0: statements about the fixed family F)

    version: "1"
    sc_ref: ["C0", "§12.4/B-RX"]
    grounds: CONTRACT_FORMALISATION
    estimand: EST:B-RX-JOINT-R
    claim_class: DescriptiveClaim
    subject_ru: "сессии этой семьи (F, один N)"
    statement_ru: "Окончательный R у {known} из {N} сессий семьи лежит в клетках таблицы цена × время; у {unknown} неизвестен, у {no_period} нет периода."

  - {id: FE:F.m.missing, sc_ref: ["E2"], surface: API:/api/d24/family, path: "members[*].missing", field_kind: CASE_RECORD, target: "number of wholly missing M5 on the case's horizon"}
  - {id: FE:F.m.path, sc_ref: ["O1", "M0", "H0"], surface: API:/api/d24/family, path: "members[*].path[*][*]", field_kind: CASE_RECORD, target: "directed (low, high, close) ticks per common clock M5 (null = a wholly missing M5)"}

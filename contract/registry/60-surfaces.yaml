  - {id: FE:F.counts.unknown, sc_ref: ["V2.1"], surface: API:/api/d24/family, path: "counts.{*}.unknown", field_kind: SUPPORT_COUNT, target: "EST:B-RX-JOINT-* ENDPOINT unknown"}

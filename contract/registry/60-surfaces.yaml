  - {id: FE:F.today.session, sc_ref: ["S1", "S2"], surface: API:/api/d24/family, path: "today.{c0,side,window,brk,brkWindow,idrH,idrL,drH,drL}", field_kind: STRATEGY_OBJECT, target: "StrategySessionRecord of the viewed day"}
  - {id: FE:F.today.zq, sc_ref: ["E1", "E3"], surface: API:/api/d24/family, path: "today.zones.{*}.q[*]", field_kind: PREFIX_STATE, target: "PrefixState cell (k, b) of today's provisional extreme"}
  - {id: FE:F.today.zv, sc_ref: ["E1"], surface: API:/api/d24/family, path: "today.zones.{*}.{v10,w}", field_kind: PREFIX_STATE, target: "PrefixState 10 v and w (ticks)"}

  - {id: FE:F.z.rshare, sc_ref: ["P3"], surface: API:/api/d24/family, path: "zones.{*}.residual_share", field_kind: STATISTIC, target: "EST:B-ZONE-RESIDUAL-R | EST:B-ZONE-RESIDUAL-X share"}

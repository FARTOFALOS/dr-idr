# DR-LAB-SC-1.1 registry · every route of the local server (lab/server.py) with its profile, and the meaning of
# every numeric field of the SC-1.1 routes. tests/contract_sc11.py fails if a route of server.py is missing here; the
# runtime gate fails a response if a number of an SC-1.1 route matches no field encoding below.
#
# Path syntax: keys separated by dots; [*] = every element of an array, [n] = element n, {*} = every value of an
# object. The contract section of a response is typed by the schema (class ContractEnvelope) and is not listed here.
# Legacy routes are a quarantined profile, never an exemption: their own definitions, their listed disagreements with
# SC-1.1, a marking header on every response, and no SC-1.1 estimand may take their numbers as input.
registry_part: surfaces

surfaces:
  - id: API:/api/d24/family
    sc_ref: ["§12.1", "§12.3"]
    route: /api/d24/family
    surface_profile: SC11_BASE_24
    definitions: SRC:SEMANTICS-24
    estimands: [EST:B-RX-JOINT-R, EST:B-RX-JOINT-X, EST:B-DR, EST:B-ORDER, EST:B-ZONE-R, EST:B-ZONE-X, EST:B-ZONE-RESIDUAL-R, EST:B-ZONE-RESIDUAL-X, EST:ZD-GRID-R, EST:ZD-GRID-X, EST:ZD-BOOT-R, EST:ZD-BOOT-X, EST:ZD-NULL-R, EST:ZD-NULL-X, EST:ZM3-STUDY]
    marking: "body.contract (ContractEnvelope) + header X-DR-Lab-Contract"
  - id: API:/api/d24/now
    sc_ref: ["§12.2", "§12.3"]
    route: /api/d24/now
    surface_profile: SC11_NOW_1_0
    definitions: SRC:NOW-1.0
    estimands: [EST:N-NEW-R, EST:N-NEW-X, EST:N-NO-NEW-R, EST:N-NO-NEW-X, EST:N-DELTA-Q-R, EST:N-DELTA-Q-X, EST:N-DELTA-GE-R, EST:N-DELTA-GE-X, EST:N-IF-NEW-R, EST:N-IF-NEW-X, EST:N-TIME-R, EST:N-TIME-X]
    marking: "body.contract (ContractEnvelope) + header X-DR-Lab-Contract"
  - id: API:/api/d24/pre
    sc_ref: ["§12.5", "§12.3"]
    route: /api/d24/pre
    surface_profile: SC11_PRE_24
    definitions: SRC:DECISIONS-2026-10-08
    estimands: [EST:P-DIR, EST:P-WHEN, EST:P-DR, EST:P-R, EST:P-X]
    marking: "body.contract (ContractEnvelope) + header X-DR-Lab-Contract"
  - id: API:/api/d24/day
    sc_ref: ["O1", "O3", "S1"]
    route: /api/d24/day
    surface_profile: SC11_OBSERVATION
    definitions: SRC:SEMANTICS-24
    marking: "body.contract (ContractEnvelope: observation and session records, no statistic) + header X-DR-Lab-Contract"
  - id: API:/api/d24/dates
    sc_ref: ["S2", "H1"]
    route: /api/d24/dates
    surface_profile: SC11_OBSERVATION
    definitions: SRC:SEMANTICS-24
    marking: "header X-DR-Lab-Contract; dates with an established first confirmation (S2, H1 journal rule); no number"
  - id: API:/api/contract
    sc_ref: ["§14.4"]
    route: /api/contract
    surface_profile: SC11_CONTRACT_SERVICE
    definitions: SRC:SC-1.1
    marking: "the compiled registry (contract/build/registry.json) with its stamps and the runtime status"
  - id: API:/api/d24/verify
    sc_ref: ["§14.4"]
    route: /api/d24/verify
    surface_profile: SC11_CONTRACT_SERVICE
    definitions: SRC:SC-1.1
    marking: "POST: recomputes page passports by the reference definitions (used by tests/ui_check24.js); read-only"
  - id: API:/api/health
    sc_ref: ["IMPLEMENTATION"]
    route: /api/health
    surface_profile: SERVICE
    definitions: SRC:AGENTS
    marking: "no statistic; the launcher polls it"
  - id: API:/api/spec
    sc_ref: ["IMPLEMENTATION"]
    route: /api/spec
    surface_profile: SERVICE
    definitions: SRC:SEMANTICS-24
    marking: "the text of docs/SEMANTICS.md; no statistic"
  - id: API:/api/query
    sc_ref: ["§0.2"]
    route: /api/query
    surface_profile: LEGACY_RESEARCH_DASHBOARD
    definitions: SRC:SEMANTICS-DASHBOARD
    legacy_discrepancies_ru:
      - "фильтры X-ray (retr, ext, rtime, etime) отбирают сессии по их будущему: в SC-1.1 это только явно названный ретроспективный срез, не живой отбор"
      - "доли «DR true» и распределения не имеют паспортов T1 / V1 / V2 контракта"
    marking: "header X-DR-Lab-Contract: profile=LEGACY_RESEARCH_DASHBOARD; status=OUTSIDE_SC11"
  - id: API:/api/scene
    sc_ref: ["§0.2"]
    route: /api/scene
    surface_profile: LEGACY_RESEARCH_DASHBOARD
    definitions: SRC:SEMANTICS-DASHBOARD
    legacy_discrepancies_ru: ["одна сессия с минутными барами; наблюдения без паспорта ObservationSnapshot"]
    marking: "header X-DR-Lab-Contract: profile=LEGACY_RESEARCH_DASHBOARD; status=OUTSIDE_SC11"
  - id: API:/api/live
    sc_ref: ["§0.2"]
    route: /api/live
    surface_profile: LEGACY_CLASSIC
    definitions: SRC:SEMANTICS-CLASSIC
    legacy_discrepancies_ru:
      - "похожие сессии отбираются по положению в IDR на минуту наблюдения с допуском ±0,25, затем ±0,5 и без предела, если их меньше 40: автоматическое расширение ради N, которое H1 запрещает для наборов SC-1.1"
      - "кластеры и зоны top-3 (0,1 и 0,2 IDR) выделяются автоматически без паспорта алгоритма P3"
      - "используется цена формирующейся M5, а не только закрытые M5"
    marking: "header X-DR-Lab-Contract: profile=LEGACY_CLASSIC; status=OUTSIDE_SC11"
  - id: API:/api/live/refresh
    sc_ref: ["§0.2"]
    route: /api/live/refresh
    surface_profile: LEGACY_CLASSIC
    definitions: SRC:SEMANTICS-CLASSIC
    legacy_discrepancies_ru: ["as /api/live"]
    marking: "header X-DR-Lab-Contract: profile=LEGACY_CLASSIC; status=OUTSIDE_SC11"
  - id: API:/api/day
    sc_ref: ["§0.2"]
    route: /api/day
    surface_profile: LEGACY_SCREEN_22
    definitions: SRC:SEMANTICS-22
    legacy_discrepancies_ru: ["свечи дня для /22/; те же наблюдения, что /api/d24/day, без паспорта ObservationSnapshot"]
    marking: "header X-DR-Lab-Contract: profile=LEGACY_SCREEN_22; status=OUTSIDE_SC11"
  - id: API:/api/day/refresh
    sc_ref: ["§0.2"]
    route: /api/day/refresh
    surface_profile: LEGACY_SCREEN_22
    definitions: SRC:SEMANTICS-22
    legacy_discrepancies_ru: ["as /api/day"]
    marking: "header X-DR-Lab-Contract: profile=LEGACY_SCREEN_22; status=OUTSIDE_SC11"
  - id: API:/api/cohort
    sc_ref: ["§0.2"]
    route: /api/cohort
    surface_profile: LEGACY_SCREEN_22
    definitions: SRC:SEMANTICS-22
    legacy_discrepancies_ru:
      - "когорта похожих до подтверждения пересобирается по состоянию на минуту: правило сравнения без паспорта H3 и без проверки V3"
    marking: "header X-DR-Lab-Contract: profile=LEGACY_SCREEN_22; status=OUTSIDE_SC11"
  - id: API:/api/family
    sc_ref: ["§0.2"]
    route: /api/family
    surface_profile: LEGACY_SCREEN_22
    definitions: SRC:SEMANTICS-22
    legacy_discrepancies_ru:
      - "экран 22 живёт по тексту правила 10 до слияния в main: звёзды — первые касания мест, проценты мест — первые прибытия; это не объекты BASE-24 и в паспорта SC-1.1 не переводятся"
      - "проценты мест одной стороны не делят сотню (meaning/10 §1)"
    marking: "header X-DR-Lab-Contract: profile=LEGACY_SCREEN_22; status=OUTSIDE_SC11"
  - id: API:/api/family-v1
    sc_ref: ["§0.2"]
    route: /api/family-v1
    surface_profile: LEGACY_SEM_V1
    definitions: SRC:DESIGN-23
    legacy_discrepancies_ru: ["первая проба DR-LAB-SEM-1.0 другим агентом (дизайн 23); её счёт не сверяется со шлюзом SC-1.1; продуктовая версия — BASE-24"]
    marking: "header X-DR-Lab-Contract: profile=LEGACY_SEM_V1; status=OUTSIDE_SC11"

encodings:

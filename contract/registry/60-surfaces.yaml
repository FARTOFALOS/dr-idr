  - {id: FE:F.m.RX.bound, sc_ref: ["P0.1"], surface: API:/api/d24/family, path: "members[*].{*}.bound", field_kind: CASE_RECORD, target: "one-sided bound of an UNKNOWN endpoint (never a final point)"}

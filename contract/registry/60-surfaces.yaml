  - {id: FE:F.weekday, sc_ref: ["H1"], surface: API:/api/d24/family, path: "weekday", field_kind: IDENTIFIER, target: "trading date weekday of the viewed day"}
  - {id: FE:F.source.boxes, sc_ref: ["O3"], surface: API:/api/d24/family, path: "source.boxes", field_kind: PROVENANCE, target: "ObservationSnapshot.content_version (number of session instances)"}
  - {id: FE:F.source.built, sc_ref: ["O3"], surface: API:/api/d24/family, path: "source.built", field_kind: PROVENANCE, target: "ObservationSnapshot.content_version (build time)"}
  - {id: FE:F.key.weekday, sc_ref: ["H1"], surface: API:/api/d24/family, path: "key.weekday", field_kind: IDENTIFIER, target: "CaseSetSpecification key weekday"}
  - {id: FE:F.key.window, sc_ref: ["H1"], surface: API:/api/d24/family, path: "key.window[*]", field_kind: IDENTIFIER, target: "CaseSetSpecification key window [start, end) day minutes"}
  - {id: FE:F.scale.orientation, sc_ref: ["M0"], surface: API:/api/d24/family, path: "scale.orientation", field_kind: MEASUREMENT, target: "MeasurementFrameRecord.direction (of the family's scale)"}

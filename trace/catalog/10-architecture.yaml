# Trace catalog · the entries of DR-LAB-SEMANTIC-ARCHITECTURE-0.1 (§§4-7, 11, 12) with the corrections of 0.2, each
# mapped to the existing objects that realise it (SC-1.1 registry ids, trace catalog ids, schema classes), the code that
# implements it (file::function) and the checks that test it. lab/semtrace.py resolves every reference at every run (a
# reference that does not resolve is a violation, not a gap) and computes the status of each entry from the checks it
# names; nothing here asserts a status. What an entry does not cover is named by its boundaries (20-boundaries.yaml).
#
# Check references: test:<file>[::<function>|#<marker>], runtime:<file>::<name>, page:<file>::<function>,
# build:<file>[::<function>], schema:<class>, trace:<check id of lab/semtrace.py>, reported:<file> (an engineer's report,
# not re-run unless a trace check re-runs it), human:<role> (a human act; never counted as machine evidence).

# Trace catalog · the standing of the contract edition and of every profile on independent axes, and the sources the
# trace adds to those of the SC-1.1 registry. Instance data of trace/schema/dr_lab_trace.yaml (class TraceCatalog).
#
# A record here preserves evidence of a decision; it does not create one (AGENTS.md, SC-1.1 §14.1). The axis
# «decision» is authored from those sources; «model definiteness» and «implementation conformance» are never authored:
# lab/semtrace.py computes them at every run; «human acceptance» is authored only from a human session on record.

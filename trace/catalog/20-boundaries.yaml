# Trace catalog · what the trace does not close. GAP-01..GAP-11 are the open boundaries of DR-LAB-SEMANTIC-ARCHITECTURE
# 0.1 §13 (with the corrections of 0.2); BND-01.. are the boundaries this work found or declares. None of them is
# reported as closed: a trace report that touches one names it, and «reliable» never hides it.
catalog_part: boundaries


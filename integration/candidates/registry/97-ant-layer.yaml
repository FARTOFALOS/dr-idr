claim_forms:
  - id: CF:ANT-REACH-AHEAD
    version: "1"
    sc_ref: ["C1", "H3", "K33"]
    grounds: PROPOSAL
    estimand: EST:ANT-REACH-AHEAD
    claim_class: ConditionalDescriptiveClaim
    subject_ru: "сессии семьи, которые к этому часу были как сегодня"
    condition_ru: "к общему часовому срезу t: своя активация раньше, нет пропущенных M5, DR ещё цел, самая глубокая точка после активации — в том же окне часов отката, что сегодняшняя, вершина пока там же, где сегодняшняя (±¼ ширины IDR)"
    statement_ru: "Из {n} сессий семьи, которые к {cut} были как сегодня, после {cut} до {lvl} SD или дальше дошли {yes} раньше слома своего DR, не дошли {no}, неизвестно у {unknown}. Это история, не прогноз сегодняшнего дня."
    labels:
      - {surface: PANEL, view: ANY, key: head, text_ru: "Слой от Anthropic · после {cut}"}
      - {surface: PANEL, view: ANY, key: head_title, text_ru: "Предложение Claude от 22.11.2026 — кандидат, оператор его не принимал. Похожие на сегодня — сессии этой семьи, которые к {cut} были как сегодня: DR цел, самая глубокая точка в том же окне, вершина пока там же, где сегодня (±0,25 SD). Строки — сколько из них после {cut} дошли до уровня раньше слома своего DR. История, не прогноз. Кнопка «Слой от Anthropic» ещё раз — 23.5 как было."}
      - {surface: PANEL, view: ANY, key: head_r, text_ru: "из похожих"}
      - {surface: PANEL, view: ANY, key: like, text_ru: "к {cut} как сегодня — {n} сессий: DR цел, самая глубокая точка в {w} ({t0}–{t1}), вершина там же, где сегодня ({top} SD ± 0,25)"}
      - {surface: PANEL, view: ANY, key: few, text_ru: "мало сессий: n={n}"}
      - {surface: PANEL, view: ANY, key: none, text_ru: "к {cut} как сегодня не было ни одной сессии семьи"}
      - {surface: PANEL, view: ANY, key: row, text_ru: "дошли до {lvl} SD"}
      - {surface: PANEL, view: ANY, key: row_title, text_ru: "Из {n} похожих на сегодня к {cut}: после {cut} до {lvl} SD или дальше дошли {yes} раньше слома своего DR; не дошли {no}; неизвестно {unknown} (пропущенные M5). История, не прогноз."}
      - {surface: PANEL, view: ANY, key: level, text_ru: "{q} % похожих — до {lvl} SD"}
      - {surface: PANEL, view: ANY, key: level_none, text_ru: "{q} % похожих — выше сегодняшней вершины такого уровня нет"}
      - {surface: PANEL, view: ANY, key: thin, text_ru: "похожих меньше {need} (5 % семьи, не меньше 4) — линии 70 % и 50 % не рисуются"}
      - {surface: PANEL, view: ANY, key: step, text_ru: "шаг {step} SD"}
      - {surface: PANEL, view: ANY, key: wait, text_ru: "Слой ждёт сегодняшнюю самую глубокую точку после подтверждения."}
      - {surface: PANEL, view: ANY, key: broken, text_ru: "DR сегодня уже сломан — уровни «после» не считаются."}
      - {surface: PANEL, view: ANY, key: nowin, text_ru: "Сегодняшняя самая глубокая точка вне окон часов отката — слой не считается."}
      - {surface: PANEL, view: ANY, key: ended, text_ru: "Блок закончился — уровней «после» нет."}
      - {surface: CANVAS, view: ANY, key: line_q, text_ru: "дошли {q} % · {lvl}"}
      - {surface: CANVAS, view: ANY, key: line_when, text_ru: "после {cut}"}
      - {surface: PANEL, view: ANY, key: check, text_ru: "Проверка на истории NQ, ES, YM 2016–2025 (семьи по дню недели; каждый день видит только прежние дни): линия 70 % сбылась в 66 % случаев, линия 50 % — в 51 %; уровни окна 23.5, прочитанные в тот же момент, — в 41 % и 29 %. Это гипотеза, оператор её не принимал."}
    value_form: POINT
    price_transfer: M0_TODAY_EDGE
    forbidden_readings_ru: ["вероятность дойти сегодня", "цель сделки", "уровень стопа", "сигнал входа или выхода", "доля всей семьи"]
    acceptance: PROPOSED_BY_EXECUTOR
    note: "DR-LAB-ANT-0.1, Claude 22.11.2026: the operator asked for the layer to compare it with the original 23.5 by eye; the definitions are not accepted"
  - id: CF:ANT-COND-WINDOW
    version: "1"
    sc_ref: ["C1", "H3", "K33"]
    grounds: PROPOSAL
    estimand: EST:ANT-COND-WINDOW
    claim_class: ConditionalDescriptiveClaim
    subject_ru: "сессии семьи, которые к этому часу были как сегодня"
    condition_ru: "к общему часовому срезу t: своя активация раньше, нет пропущенных M5, DR ещё цел, самая глубокая точка после активации — в том же окне часов отката, что сегодняшняя, вершина пока там же, где сегодняшняя (±¼ ширины IDR)"
    statement_ru: "Из {n} сессий семьи, которые к {cut} были как сегодня, DR устоял и откат до вершины был в окне {w} у {yes}; иначе — у {no}; неизвестно у {unknown}. Уровни окна «дошли 70 % / 50 %» посчитаны только по таким дням. Это история, не прогноз."
    labels:
      - {surface: PANEL, view: ANY, key: row, text_ru: "так закончились: true и откат в {w}"}
      - {surface: PANEL, view: ANY, key: row_title, text_ru: "Уровни окна {w} «дошли 70 % / 50 %» посчитаны по сессиям, где DR устоял и откат до вершины был в {w}. Из {n} похожих на сегодня к {cut} так закончились {yes}; DR сломан или откат до вершины в другом окне — {no}; неизвестно {unknown}. История, не прогноз."}
      - {surface: PANEL, view: ANY, key: note, text_ru: "Уровни окна {w} — {levels} — верны, если DR устоит и откат до вершины останется в {w}"}
      - {surface: PANEL, view: ANY, key: note_none, text_ru: "Уровней окна {w} «дошли 70 % / 50 %» сейчас нет"}
      - {surface: CANVAS, view: ANY, key: cond, text_ru: "если true · {w}"}
      - {surface: CANVAS, view: ANY, key: passed, text_ru: "пройден"}
    value_form: POINT
    price_transfer: NONE
    forbidden_readings_ru: ["вероятность, что DR сегодня устоит", "доля всей семьи", "стоп удержится", "сигнал входа или выхода"]
    acceptance: PROPOSED_BY_EXECUTOR
    note: "DR-LAB-ANT-0.1, Claude 22.11.2026: the operator asked for the layer to compare it with the original 23.5 by eye; the definitions are not accepted"

validations:
  - id: VAL:ANT-WALKFORWARD-2211
    version: "0.1"
    sc_ref: ["V3"]
    grounds: RESEARCH_RESULT
    title_ru: проверка «Слоя от Anthropic» на истории оператора (22.11.2026)
    validates: [CS:ANT-LIKE-NOW-1, EST:ANT-REACH-AHEAD, EST:ANT-COND-WINDOW]
    validation_kind: RESEARCH_EXPLORATORY
    protocol_ru: "каждая сессия 2016–2025 как «сегодня», похожие — только из более ранних дат её семьи (не меньше 40); срезы через 15, 30, 60 и 120 минут после подтверждения; линия q — дальняя клетка, до которой после среза раньше слома DR дошли не меньше q похожих (при похожих не меньше порога массы TP-2.0); «сбылось» — «сегодня» после среза дошло до неё раньше своего слома DR (неизвестные исходы не считаются); для сравнения — уровни окна 23.5 (Ч12), ещё не пройденные к срезу"
    corpus_ru: "NQ, ES, YM × ADR, ODR, RDR; 7 200 дней 2016–2025 в 264 семьях (ключи — из 40 случайных дат второй половины 2025 на инструмент), 27 659 срезов"
    corpus_seen_before: true
    result_ru: "линия 70 % стояла в 36 % срезов и сбылась в 66 % (похожие говорили в среднем 75 %); линия 50 % — в 65 % срезов, сбылась в 51 % (говорили 54 %); уровни окна 23.5, прочитанные в тот же момент, сбылись в 41 % (70 %) и 29 % (50 %); долю «так закончились» похожие давали 43–46 %, на деле 49 %; допуск ±¼ по вершине выбран после сравнения с «не выше сегодняшней», ±½ и полосой ½ ниже на той же истории — взят готовый допуск M1X «Сейчас», не подобранный"
    lifecycle: HYPOTHESIS
    runtime_artifact: "device scratch antcal.py, antcal_*near4.json (22.11.2026; built from market data, never committed)"
    source_refs: [SRC:ANT-LAYER-0.1]

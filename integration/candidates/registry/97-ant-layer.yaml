# «Слой от Anthropic» on screen 23.5 — the candidate DR-LAB-ANT-0.1 (meaning/28-sloj-ot-anthropic.md).
# Claude's proposal after the calibration of 22.11.2026 (project doc «DR Lab: уровни 70/50 на 23.5 и 24»): the window's
# levels «дошли 70 % / 50 %» (DR-LAB-TP-2.0 Ч12) are true only on days whose DR holds and whose pullback before the top
# stays in that window; at the moment of looking, the honest «from here» number is the share of the family's sessions
# that at the same clock were like today and afterwards reached the level before their DR broke.
# The operator asked for it as a layer over the original 23.5 (22.11.2026), switched on and off by a button; he has not
# accepted these definitions: every form here is PROPOSED_BY_EXECUTOR, the edition DR-LAB-CANDIDATES-1 (no C2 / C3).
# Screen 24, SC-1.1, the accepted registry (contract/registry) and TP-2.0 stay as they are.

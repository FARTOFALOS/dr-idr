estimands:
  - id: EST:ANT-REACH-AHEAD
    version: "1"
    sc_ref: ["T1", "C1", "H3"]
    grounds: PROPOSAL
    question: Q:ANT-REACH-AHEAD
    q1_formalised_part_ru: "среди сессий семьи, похожих на сегодня к срезу t (CS:ANT-LIKE-NOW-1, окно [b0, b1)), — сколько после t дошли до уровня k/10 SD (максимум M5 в клетке k или дальше) раньше слома своего DR; уровень k — выше сегодняшней вершины к t"
    q2_target: FIXED_HISTORICAL_SET
    q3_unit: SESSION_AT_CUT
    q4_case_set: [CS:ANT-LIKE-NOW-1]
    q4_denominator: N_MATCH_AT_CUT
    q5_outcome: OUT:ANT-REACH-BEFORE-BREAK-1
    q5_region: REG:LEVEL-1
    q6_time_ru: "отбор — по M5, закрытым к срезу t (общие часы ET); событие — M5, закрывшиеся после t, до первой M5 с закрытием за своим противоположным DR (она не входит), не позже конца блока H"
    q6_cut: CUT:LAST-CLOSED-M5-1
    q7_measure: SHARE
    q8_unknown: UNKNOWN_KEPT_IN_N_NO_COORDINATE
    q8_weights: NONE
    q8_order_ru: "дошли + не дошли + неизвестно = число похожих; доля «дошли» не растёт с уровнем; при наборе меньше 20 — пометка «мало сессий: n=…», набор не расширяется; линии 70 % и 50 % — только при наборе не меньше порога массы TP-2.0 (5 % семьи, не меньше 4)"
    parameters:
      - {name: cut, parameter_kind: CUT, meaning_ru: "общий часовой срез t — закрытие последней закрытой M5"}
      - {name: b0, parameter_kind: TIME_WINDOW_CELLS, meaning_ru: "первая 15-минутная клетка окна часов отката T, где сегодняшняя самая глубокая точка"}
      - {name: b1, parameter_kind: TIME_WINDOW_CELLS, meaning_ru: "клетка после этого окна"}
      - {name: k, parameter_kind: PRICE_CELL, meaning_ru: "уровень k/10 SD от края IDR — клетка цены выше сегодняшней вершины к t"}
    profile: PROFILE:BASE-24
  - id: EST:ANT-COND-WINDOW
    version: "1"
    sc_ref: ["T1", "C1", "H3"]
    grounds: PROPOSAL
    question: Q:ANT-COND-WINDOW
    q1_formalised_part_ru: "среди сессий семьи, похожих на сегодня к срезу t (CS:ANT-LIKE-NOW-1, окно [b0, b1)), — у скольких DR устоял до конца блока и откат до вершины был в том же окне [b0, b1): условие, при котором верны уровни окна «дошли 70 % / 50 %»"
    q2_target: FIXED_HISTORICAL_SET
    q3_unit: SESSION_AT_CUT
    q4_case_set: [CS:ANT-LIKE-NOW-1]
    q4_denominator: N_MATCH_AT_CUT
    q5_outcome: OUT:ANT-TRUE-IN-WINDOW-1
    q5_region: REG:TIME-WINDOW-1
    q6_time_ru: "отбор — по M5, закрытым к срезу t (общие часы ET); исход DR и откат до вершины — до конца блока H"
    q6_cut: CUT:LAST-CLOSED-M5-1
    q7_measure: SHARE
    q8_unknown: UNKNOWN_KEPT_IN_N_NO_COORDINATE
    q8_weights: NONE
    q8_order_ru: "так + иначе + неизвестно = число похожих; при наборе меньше 20 — пометка «мало сессий: n=…», набор не расширяется"
    parameters:
      - {name: cut, parameter_kind: CUT, meaning_ru: "общий часовой срез t — закрытие последней закрытой M5"}
      - {name: b0, parameter_kind: TIME_WINDOW_CELLS, meaning_ru: "первая 15-минутная клетка окна часов отката T, где сегодняшняя самая глубокая точка"}
      - {name: b1, parameter_kind: TIME_WINDOW_CELLS, meaning_ru: "клетка после этого окна"}
    profile: PROFILE:BASE-24


<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DR Lab · 24</title>
<style>
:root{--bg:#08090C;--panel:#0E1014;--raised:#161A21;--hover:#1C212A;--line:#1C2027;--line2:#2A2F38;--text:#D1D4DC;--text2:#A3A8B3;--text3:#6F7582;--replay:#F7C948;--hist:#8FB4FF;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;user-select:none}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;padding:0}
#tb{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap}
.seg{display:flex;gap:2px;padding:3px;background:var(--raised);border-radius:7px}
.seg button{height:26px;padding:0 9px;border-radius:5px;color:var(--text2)}
.seg button:hover{background:var(--hover);color:var(--text)}
.seg button.on{background:#262B35;color:#fff}
.seg button.off{opacity:.45;cursor:default}
.seg button i{font-style:normal;font-weight:700}
.lbl{color:var(--text3);font-size:12px}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;background:var(--raised)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#089981}
.pill.rp{background:rgba(247,201,72,.12);color:var(--replay)}
.pill.rp .dot{background:var(--replay)}
.pill.hs{background:rgba(143,180,255,.12);color:var(--hist)}
.pill.hs .dot{background:var(--hist)}
#live{color:var(--text2)}
#back{height:28px;padding:0 10px;border-radius:6px;background:var(--raised);color:var(--text)}
#back:hover{background:var(--hover)}
#lay,#cfgb,#dayb,#areab,#cmp22{height:28px;padding:0 10px;border-radius:6px;background:var(--raised);color:var(--text)}
#lay:hover,#lay.on,#cfgb:hover,#cfgb.on,#dayb:hover,#dayb.on,#areab:hover,#cmp22:hover{background:var(--hover)}
#areab.on{background:#2B3445;color:#fff;box-shadow:inset 0 0 0 1px #5E6C84}
#dayb.hs{color:var(--hist)}
#cmp22{display:flex;align-items:center;text-decoration:none;color:var(--text2);font-size:12px}
#menu{position:absolute;top:38px;right:180px;width:300px;padding:6px;background:#12151B;border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:20}
#menu[hidden]{display:none}
#menu label{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:5px;cursor:pointer}
#menu label:hover{background:var(--hover)}
#menu input{accent-color:#5DB8FF;margin:0}
#menu .sw{width:14px;height:8px;border-radius:2px;flex:0 0 14px}
#dayp{position:absolute;top:38px;right:260px;width:300px;padding:10px 12px;background:#12151B;border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:22}
#dayp[hidden]{display:none}
#dayp .dr{display:flex;align-items:center;gap:6px;margin:6px 0}
#dayp input[type=date]{flex:1;background:var(--raised);color:var(--text);border:1px solid var(--line2);border-radius:5px;padding:4px 6px;font:inherit;color-scheme:dark}
#dayp button{height:28px;padding:0 10px;border-radius:5px;background:var(--raised)}
#dayp button:hover{background:var(--hover)}
#dayp .k{color:var(--text3);font-size:12px}
#main{position:absolute;left:0;top:40px;right:300px;bottom:0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;z-index:10;max-width:380px;padding:8px 10px;border-radius:7px;background:rgba(18,21,27,.96);border:1px solid var(--line2);box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:12.5px;line-height:1.45;white-space:normal}
#tip[hidden]{display:none}
#tip b{font-weight:600}
#tip .k{color:var(--text3)}
#tip .big{font-size:18px;font-weight:700;line-height:1.1}
#nav{position:absolute;display:flex;gap:4px;padding:4px;border-radius:8px;background:rgba(18,21,27,.9);border:1px solid var(--line2);opacity:0;transition:opacity .15s;z-index:5}
#nav.show{opacity:1}
#nav button{width:28px;height:26px;border-radius:5px;color:var(--text2);font-size:15px}
#nav button:hover{background:var(--hover);color:#fff}
#panel{position:absolute;right:0;top:40px;bottom:0;width:300px;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:12px 14px 20px}
#cfgp{position:absolute;top:38px;right:180px;width:360px;max-height:calc(100% - 50px);overflow-y:auto;padding:8px 12px 12px;background:#12151B;border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:21}
#cfgp[hidden]{display:none}
#cfgp .ch{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px;border-bottom:1px solid var(--line2)}
#cfgp .ch button{padding:4px 10px;border-radius:5px;background:var(--raised)}
#cfgp .ch button:hover{background:var(--hover)}
#cfgp .cg{margin:10px 0 4px;color:var(--text3);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
#cfgp .cr{display:grid;grid-template-columns:1fr 120px 30px;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
#cfgp .cr span{color:var(--text2)}
#cfgp .cr input[type=color]{grid-column:2 / 4;width:100%;height:22px;padding:0;border:1px solid var(--line2);border-radius:4px;background:none;cursor:pointer}
#cfgp .cr select{grid-column:2 / 4;background:var(--raised);color:var(--text);border:1px solid var(--line2);border-radius:4px;padding:3px}
#cfgp .cr input[type=range]{width:120px;accent-color:#9AA6B8}
#cfgp .cr em{font-style:normal;color:var(--text3);font-size:11px;text-align:right}
.dim{color:var(--text3)}
/* Design 24: design 22's panel (same place, type and manner) with the objects of DR-LAB-SEM-1.0. */
#dr21-root{position:relative;width:100%;height:100%;--p21-width:292px}
#main{right:var(--p21-width)}
#panel{width:var(--p21-width);padding:12px 12px 12px;font-size:13px;line-height:1.35;color:#D1D4DC}
.p21-empty{color:#98A3B3;padding:8px 2px}
.p21-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 6px;color:#A6AFBC;font-size:12px;font-weight:600;letter-spacing:.2px}
.p21-h>span:first-child{min-width:0}
.p21-h span{font-weight:400;color:#7F8896;font-size:11.5px}
.p21-h>span:last-child{white-space:nowrap}
.p21-h.second{margin-top:14px;padding-top:10px;border-top:1px solid #252B34}
.p21-link{position:relative;display:flex;align-items:baseline;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums}
.p21-link:hover,.p21-link.on{background:#1C2330}
.p21-link.pinned{background:#243042}
.p21-link .t{flex:1;min-width:0;color:#C9CFD8}
.p21-link .t i{font-style:normal}
.p21-link>b{font-weight:700;white-space:nowrap}
.p21-link.dim .t{color:#8F98A6}
.p21-link.ev{align-items:flex-start}
.p21-link.ev .t{display:flex;flex-direction:column;gap:1px}
.p21-link.mc{align-items:flex-start}
.p21-link.mc .t{display:flex;flex-direction:column;gap:1px}
.p24-a{color:#AEB8C6;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.p24-a:hover{color:#E6EAF0}
.p21-link.fc{padding:2px 6px;font-size:12.5px;overflow:hidden}
.p21-link.fc .bar{position:absolute;left:0;top:0;bottom:0;opacity:.12;border-radius:4px;pointer-events:none}
.p21-link.fc.dim{cursor:default}
.p21-note{color:#8F98A6;font-size:12px;padding:3px 0}
.p21-sub{color:#8F98A6;font-size:11.5px;font-weight:400}
.p24-seg{display:flex;gap:2px;padding:3px;margin:2px 0 8px;background:#161A21;border-radius:7px}
.p24-seg button{flex:1;height:26px;padding:0 6px;border-radius:5px;color:#A3A8B3;font-size:12px}
.p24-seg button:hover{background:#1C212A;color:#D1D4DC}
.p21-h .p24-seg.sm{margin:0;padding:2px;flex:0 0 auto}
.p21-h .p24-seg.sm button{flex:0 0 auto;height:20px;padding:0 7px;font-size:11px;font-weight:500}
.p21-link.zst-IMPOSSIBLE{opacity:.5}
.p21-link.zst-HOLDS .p21-sub{color:#C9CFD8}
.p24-seg button.on{background:#262B35;color:#fff}
.p24-bar{display:flex;height:8px;margin:2px 0 4px;border-radius:3px;overflow:hidden;background:#1C2027}
.p24-bar i{display:block;height:100%}
.p24-out{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
.p24-out .p21-link{padding:2px 6px}
.p24-x{margin-left:6px;padding:0 5px;border-radius:4px;color:#A3A8B3;font-size:11px;background:#161A21}
.p24-x:hover{background:#25303B;color:#fff}
.p24-mem{font-size:12.5px;line-height:1.5}
.p24-btn{display:block;width:100%;margin:10px 0 0;padding:8px 10px;border-radius:6px;background:#1B2536;color:#CFE0FF;text-align:left;font-size:12.5px}
.p24-btn:hover{background:#243148;color:#fff}
.p24-mem i{font-style:normal;font-weight:700}
#apibar{display:flex;align-items:center;gap:8px;font-size:12px;color:#A3A8B3;white-space:nowrap;min-width:0}
#apibar .feed{overflow:hidden;text-overflow:ellipsis;max-width:260px}
#apibar .err{color:#F28B82;font-weight:600}
#apibar .auto{display:flex;align-items:center;gap:4px;cursor:pointer}
#apibar button{height:26px;padding:0 9px;border-radius:5px;background:#161D26;color:#C9CFD8}
#apibar button:hover{background:#25303B;color:#fff}
#apibar button:disabled{opacity:.5}
#step21{display:flex;gap:2px}
#step21 button,#panel21toggle{padding:5px 7px;background:#161D26;border-radius:4px;color:#B7C1CE;font-size:12px;white-space:nowrap}
#step21 button:hover,#panel21toggle:hover{background:#25303B;color:#fff}
#dr21-root.panel21closed #panel{display:none}
#dr21-root.panel21closed #main{right:0}
#tb .version24{font-size:12px;color:#8FB4FF;font-weight:600}
#cv{touch-action:none}
#det{position:absolute;left:0;right:0;bottom:0;height:22px;background:#0B0C10;border-top:1px solid #1C2027;overflow:hidden;transition:height .15s;z-index:6}
#det.open{height:222px;background:#0B0C10;border-top-color:#2A2F38}
#deth{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#6F7582;font-size:11.5px;font-weight:600;cursor:pointer}
#det.open #deth{color:#D1D4DC}
#deth .k{font-weight:400;color:#8FB4FF}
#detb{display:flex;gap:14px;height:196px;padding:4px 10px 8px}
#dett{flex:0 0 46%;overflow:hidden;font-size:12px;line-height:1.35}
#detc{flex:1;height:100%;min-width:0}
#detx{flex:1;min-width:0;overflow:hidden;font-size:12px;line-height:1.35}
#detx .p24-dr{grid-template-columns:132px 1fr}
.p24-dr{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:1px 0}
.p24-dr span{color:#6F7582}
.p24-dr b{font-weight:500;color:#D1D4DC;overflow:hidden;text-overflow:ellipsis}
.p24-dr .k{color:#6F7582;font-weight:400}
@media(max-width:1500px){#tb{gap:6px}.seg button{padding:0 7px}#apibar .feed{max-width:170px}}
@media(max-width:1300px){#dr21-root{--p21-width:268px}#date{display:none}#apibar .auto{display:none}#cmp22{display:none!important}}
@media(max-width:1100px){#tb .version24,#tb .lbl{display:none}#apibar{display:none}#areab{font-size:0;padding:0 8px}#areab::before{content:'▭';font-size:13px}}
@media(max-width:700px){html,body{height:auto;min-height:100%;overflow:auto}#dr21-root{height:1300px!important}#tb{height:auto;min-height:90px;flex-wrap:wrap;align-content:center;gap:6px;padding:6px 10px;white-space:normal}#main{top:120px;right:0;height:570px;bottom:auto}#panel{top:690px;left:0;width:100%;bottom:0;border-left:0;border-top:1px solid #252B34;padding:10px 14px}#dr21-root.panel21closed{height:690px!important}#menu,#cfgp,#dayp{right:5px;left:5px;top:115px;width:auto;max-width:calc(100% - 10px)}#clock{margin-left:auto}#step21 button,#panel21toggle{min-height:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.p21-link[title],.p21-h span[title]{cursor:help}

</style>
</head>
<body>
<div id="dr21-root" aria-label="DR Lab — вариант 24">
<div id="tb">
  <div class="seg" id="inst"></div>
  <div class="seg" id="sess"></div>
  <span class="lbl" id="date"></span>
  <span class="lbl version24">№ 24</span>
  <div class="seg" id="mode"><button data-m="bounds">Границы хода</button><button data-m="path">Путь семьи</button></div>
  <div class="seg" id="ev"></div>
  <button type="button" id="areab" title="Выбрать область мышью: цена или цена × время">▭ Область</button>
  <div class="sp"></div>
  <div id="apibar"></div>
  <button type="button" id="dayb">История</button>
  <div id="step21"><button type="button" data-step="-5" aria-label="На пять минут назад">−5м</button><button type="button" data-step="5" aria-label="На пять минут вперёд">+5м</button></div>
  <button type="button" id="panel21toggle" aria-pressed="true">Сводка</button>
  <button id="lay">Слои ▾</button>
  <button id="cfgb" title="Настройки">⚙</button>
  <a id="cmp22" href="/" target="_blank" rel="noopener" title="Открыть №22 рядом для сравнения">№22 ↗</a>
  <div id="clock"></div>
</div>
<div id="menu" hidden></div>
<div id="cfgp" hidden></div>
<div id="dayp" hidden></div>
<div id="main"><canvas id="cv" role="img" aria-label="Свечной график с событиями семьи, уровнями DR и IDR"></canvas><div id="tip" hidden></div><div id="nav"><button data-z="1" title="Отдалить">−</button><button data-z="-1" title="Приблизить">+</button><button data-z="0" title="Сбросить вид (Alt+R)">↺</button></div><div id="det"><div id="deth"></div><div id="detb"><div id="dett"></div><div id="detx"></div><canvas id="detc"></canvas></div></div></div>
<aside id="panel"></aside>
<script src="d24.js"></script>
</div>
</body>
</html>

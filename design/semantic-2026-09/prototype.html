    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){st.layout=b.dataset.layout;st.hover=null;render();save()}else if(b.dataset.drawer){st.drawer=st.drawer===b.dataset.drawer?null:b.dataset.drawer;drawDrawer()}else if(b.dataset.closeDrawer){st.drawer=null;drawDrawer()}else if(b.dataset.select)select(b.dataset.select);else if(b.dataset.clear)clear();else if(b.dataset.toggle){const k=b.dataset.toggle;st.layers[k]=!st.layers[k];render();save()}else if(b.dataset.hist){st.histKind=b.dataset.hist;drawDrawer()}else if(b.dataset.histaxis){st.histAxis=b.dataset.histaxis;drawDrawer()}else if(b.dataset.session){const ranges={ADR:[-310,140],ODR:[160,540],RDR:[555,960]};st.view=ranges[b.dataset.session];st.manualY=null;drawChart();save()}else if(b.id==='dr-fit')fit();else if(b.id==='dr-day'){st.view=[-360,960];st.manualY=null;drawChart()}else if(b.id==='dr-zoomin')zoom(.8);else if(b.id==='dr-zoomout')zoom(1.25);else if(b.id==='dr-profile'){st.profile=st.profile==='touch'?'extrema':'touch';render();save()}else if(b.id==='dr-return'){st.replay=null;clear();render()}else if(b.id==='dr-draw'){st.draw=!st.draw;render()}else if(b.id==='dr-next'){const keys=Object.keys(scenes);st.scene=keys[(keys.indexOf(st.scene)+1)%keys.length];st.replay=null;st.selected=null;st.hover=null;st.manualY=null;render();save()}else if(b.id==='dr-show-position'){st.scene='position';st.replay=null;render();save()}});
    root.addEventListener('change',e=>{if(e.target.id==='dr-scene'){st.scene=e.target.value;st.replay=null;st.selected=null;st.hover=null;st.manualY=null;render();save()}else if(e.target.dataset.layer){st.layers[e.target.dataset.layer]=e.target.checked;render();save()}else if(e.target.dataset.plan){const v=Number(e.target.value);if(Number.isFinite(v)){st[e.target.dataset.plan]=tick(v);drawDrawer();drawChart()}}});
    root.addEventListener('pointerover',e=>{const b=e.target.closest('[data-select]');if(!b)return;st.hover=b.dataset.select;applyFocus()});
    root.addEventListener('pointerout',e=>{const b=e.target.closest('[data-select]');if(!b||b.contains(e.relatedTarget))return;st.hover=null;applyFocus()});
    let drag=null,ignoreClick=false,clickTarget=null;
    const chart=$('#dr-chart');
    chart.addEventListener('pointerdown',e=>{if(e.button!==0||!geo)return;const r=chart.getBoundingClientRect(),xx=e.clientX-r.left,yy=e.clientY-r.top;const target=e.target.closest('[data-candle],[data-object]');clickTarget=target?{candle:target.dataset.candle,object:target.dataset.object}:null;drag={x:xx,y:yy,view:[...st.view],yrange:[geo.lo,geo.hi],kind:xx>geo.right?'price':yy>geo.bottom+35?'time':'pan',moved:false};chart.setPointerCapture(e.pointerId)});
    chart.addEventListener('pointermove',e=>{if(!geo)return;const r=chart.getBoundingClientRect(),xx=e.clientX-r.left,yy=e.clientY-r.top;
      if(drag){const dx=xx-drag.x,dy=yy-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(!drag.moved)return;if(drag.kind==='price'){const f=Math.exp(dy*.007),mid=(drag.yrange[0]+drag.yrange[1])/2,half=(drag.yrange[1]-drag.yrange[0])/2*f;st.manualY=[mid-half,mid+half]}else if(drag.kind==='time'){const f=Math.exp(-dx*.006),len=clamp((drag.view[1]-drag.view[0])*f,55,1320);st.view=[drag.view[1]-len,drag.view[1]]}else{const dt=dx/(geo.right-geo.left)*(drag.view[1]-drag.view[0]);st.view=[drag.view[0]-dt,drag.view[1]-dt];if(st.manualY){const dp=dy/(geo.bottom-geo.top)*(drag.yrange[1]-drag.yrange[0]);st.manualY=[drag.yrange[0]+dp,drag.yrange[1]+dp]}}drawChart();return}
      if(xx<geo.left||xx>geo.right||yy<geo.top||yy>geo.bottom+33)return;
      const t=geo.tm(xx),pr=tick(geo.px(yy)),nearest=bars.find(b=>b[0]<=t&&b[0]+5>t);if(nearest)$('#dr-ohlc').textContent=time(nearest[0])+' · O '+price(nearest[1])+'  H '+price(nearest[2])+'  L '+price(nearest[3])+'  C '+price(nearest[4]);else $('#dr-ohlc').textContent=time(t)+' · '+price(pr);
      const object=e.target.closest('[data-object]');let id=object?.dataset.object??null;
      if(!id&&ov&&t>now&&yy<geo.bottom){id='fan';if(!st.layers.fan)id=null;if(id)objects.get('fan').at=t}
      if(id==='fan'&&objects.has('fan'))objects.get('fan').at=t;
      if(st.hover!==id){st.hover=id;applyFocus()}else if(id==='fan'){renderInspector();drawGuides(objects.get('fan'))}
      if(!id&&yy<geo.bottom){$('#dr-crosshair').innerHTML=line(xx,geo.top,xx,geo.bottom,'stroke="var(--muted)" opacity=".28"')+line(geo.left,yy,geo.right,yy,'stroke="var(--muted)" opacity=".22"')}else $('#dr-crosshair').innerHTML='';
    });
    chart.addEventListener('pointerup',e=>{ignoreClick=!!drag?.moved;drag=null;if(chart.hasPointerCapture(e.pointerId))chart.releasePointerCapture(e.pointerId);if(ignoreClick)save()});
    chart.addEventListener('pointercancel',()=>{drag=null;ignoreClick=true});
    chart.addEventListener('pointerleave',()=>{if(drag)return;st.hover=null;applyFocus();if($('#dr-crosshair'))$('#dr-crosshair').innerHTML=''});
    chart.addEventListener('click',e=>{if(ignoreClick){ignoreClick=false;clickTarget=null;return}const r=chart.getBoundingClientRect(),xx=e.clientX-r.left,yy=e.clientY-r.top;if(st.draw&&xx<geo.right&&yy<geo.bottom){st.drawings.push({id:st.drawings.length+1,t:geo.tm(xx),p:tick(geo.px(yy))});st.draw=false;render();return}const c=clickTarget?.candle??e.target.closest('[data-candle]')?.dataset.candle,o=clickTarget?.object??e.target.closest('[data-object]')?.dataset.object;clickTarget=null;if(c){const t=+c;st.replay=st.replay===t?null:t;st.selected=null;st.hover=null;render();return}if(o){select(o);return}if(ov&&geo.tm(xx)>now&&yy<geo.bottom&&st.layers.fan){const f=objects.get('fan');if(f)f.at=geo.tm(xx);select('fan')}else if(yy>geo.bottom&&yy<geo.bottom+34&&geo.tm(xx)<now){st.replay=Math.floor(geo.tm(xx)/5)*5;st.selected=null;st.hover=null;render()}else clear()});
    chart.addEventListener('wheel',e=>{e.preventDefault();if(!geo)return;const r=chart.getBoundingClientRect(),xx=e.clientX-r.left;if(xx>geo.right){const f=Math.exp(e.deltaY*.0015),mid=(geo.lo+geo.hi)/2,half=(geo.hi-geo.lo)/2*f;st.manualY=[mid-half,mid+half];drawChart()}else if(e.shiftKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)){const dt=(e.deltaX||e.deltaY)*.35;st.view=st.view.map(t=>t+dt);drawChart()}else zoom(Math.exp(e.deltaY*.0015),geo.tm(xx));save()},{passive:false});
    chart.addEventListener('dblclick',e=>{const r=chart.getBoundingClientRect();if(e.clientX-r.left>geo.right){st.manualY=null;drawChart()}else if(e.clientY-r.top>geo.bottom+33)fit()});
    root.addEventListener('keydown',e=>{if(e.key==='Escape'){st.draw=false;clear();if(st.drawer){st.drawer=null;drawDrawer()}}if(e.altKey&&e.key.toLowerCase()==='r'){e.preventDefault();fit()}});
    const resize=new ResizeObserver(()=>{if(geo)drawChart()});resize.observe(chart);
    render();
    if(globalThis.Tweak){const tweaks={ladder:'extrema',structure:true,tested:true};const tw=new Tweak({container:root,onChange:()=>{st.profile=tweaks.ladder;st.layers.levels=tweaks.structure;st.layers.tested=tweaks.tested;render()}});tw.addSelect(tweaks,'ladder',{label:'Профиль у цены',options:[{label:'Экстремумы',value:'extrema'},{label:'Касания',value:'touch'}]});tw.addToggle(tweaks,'structure',{label:'Прошлые уровни'});tw.addToggle(tweaks,'tested',{label:'След проторгованных VIB'})}
  })();
  </script>
</div>

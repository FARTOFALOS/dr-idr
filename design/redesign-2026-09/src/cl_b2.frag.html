<div style="position: absolute; left: {{xNow}}px; top: 0px; width: {{cloudW}}px; height: __PH__px; overflow: hidden; pointer-events: none"><div style="position: absolute; left: 0px; top: 0px; width: {{cloudW}}px; height: __PH__px; filter: blur(9px)"><sc-for list="{{cloud}}" as="e" hint-placeholder-count="0"><div style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; width: {{e.w}}px; height: {{e.h}}px; background: {{e.bg}}"></div></sc-for></div></div>
<svg width="__PW__" height="__PH__" viewBox="0 0 __PW__ __PH__" style="position: absolute; left: 0px; top: 0px; pointer-events: none"><path d="{{cr0}}" fill="none" stroke="rgba(255,90,95,0.32)" stroke-width="1" stroke-dasharray="4 3"></path><path d="{{ce0}}" fill="none" stroke="rgba(52,211,153,0.3)" stroke-width="1"></path><path d="{{ce1}}" fill="none" stroke="rgba(52,211,153,0.6)" stroke-width="1.1"></path><path d="{{ce2}}" fill="none" stroke="rgba(150,240,200,0.95)" stroke-width="1.4"></path></svg>
<sc-for list="{{pickBox}}" as="e" hint-placeholder-count="0"><div style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; width: {{e.w}}px; height: {{e.h}}px; box-sizing: border-box; border-radius: 3px; background: {{e.bg}}; border: 1px solid rgba(255,255,255,0.8); pointer-events: none"></div></sc-for>
<sc-for list="{{tris}}" as="e" hint-placeholder-count="0"><div style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; width: {{e.w}}px; height: {{e.h}}px; filter: {{e.glow}}; pointer-events: none"><div style="width: {{e.w}}px; height: {{e.h}}px; background: #FF5A5F; opacity: {{e.op}}; clip-path: {{e.clip}}"></div></div></sc-for>
<sc-for list="{{pickTri}}" as="e" hint-placeholder-count="0"><div style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; width: {{e.w}}px; height: {{e.h}}px; filter: {{e.glow}}; pointer-events: none"><div style="width: {{e.w}}px; height: {{e.h}}px; background: #FF7A7E; clip-path: {{e.clip}}"></div></div></sc-for>
<sc-for list="{{hits}}" as="e" hint-placeholder-count="0"><div onMouseEnter="{{e.enter}}" onMouseLeave="{{e.leave}}" onClick="{{e.click}}" style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; width: {{e.w}}px; height: {{e.h}}px; box-sizing: border-box; border: {{e.bd}}; border-radius: 2px; cursor: pointer"></div></sc-for>
<sc-for list="{{zlab}}" as="e" hint-placeholder-count="0"><div style="position: absolute; left: 0px; top: 0px"><div style="position: absolute; left: {{e.bx}}px; top: {{e.by}}px; width: {{e.bw}}px; height: {{e.bh}}px; box-sizing: border-box; border: {{e.bb}}; border-radius: 4px; display: {{e.box}}; pointer-events: none"></div><div onMouseEnter="{{e.enter}}" onMouseLeave="{{e.leave}}" onClick="{{e.click}}" style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; height: 16px; display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; font-size: 11px; text-shadow: 0 0 3px #0B0D10, 0 0 3px #0B0D10"><span style="width: 13px; height: 13px; border-radius: 7px; background: {{e.bg}}; color: #0B0D10; font-size: 9.5px; font-weight: 700; line-height: 13px; text-align: center; text-shadow: none">{{e.t}}</span><span style="color: {{e.pc}}">{{e.pct}}</span><span style="display: {{e.wd}}; color: #D1D4DC">{{e.when}}</span></div></div></sc-for>

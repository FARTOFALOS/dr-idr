<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DR Lab · 22 · Созвездия — смысл числа</title>
<style>
:root{--bg:#08090C;--panel:#0E1014;--raised:#161A21;--hover:#1C212A;--line:#1C2027;--line2:#2A2F38;--text:#D1D4DC;--text2:#A3A8B3;--text3:#6F7582;--cont:#5DB8FF;--pull:#FFB347;--up:#B9A2FF;--dn:#FF8FB5;--replay:#F7C948;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;user-select:none}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;padding:0}
#tb{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap}
.seg{display:flex;gap:2px;padding:3px;background:var(--raised);border-radius:7px}
.seg button{height:26px;padding:0 10px;border-radius:5px;color:var(--text2)}
.seg button:hover{background:var(--hover);color:var(--text)}
.seg button.on{background:#262B35;color:#fff}
.seg button.off{opacity:.45;cursor:default}
.lbl{color:var(--text3);font-size:12px}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;background:var(--raised)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#089981}
.pill.rp{background:rgba(247,201,72,.12);color:var(--replay)}
.pill.rp .dot{background:var(--replay)}
#live{color:var(--text2)}
#back{height:28px;padding:0 10px;border-radius:6px;background:var(--raised);color:var(--text)}
#back:hover{background:var(--hover)}
#lay{height:28px;padding:0 10px;border-radius:6px;background:var(--raised)}
#lay:hover,#lay.on{background:var(--hover)}
#menu{position:absolute;top:38px;right:180px;width:290px;padding:6px;background:#12151B;border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:20}
#menu[hidden]{display:none}
#menu label{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:5px;cursor:pointer}
#menu label:hover{background:var(--hover)}
#menu input{accent-color:#5DB8FF;margin:0}
#menu .sw{width:14px;height:8px;border-radius:2px;flex:0 0 14px}
#menu .hint{margin-left:auto;color:var(--text3);font-size:11px}
#main{position:absolute;left:0;top:40px;right:300px;bottom:0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;z-index:10;max-width:340px;padding:8px 10px;border-radius:7px;background:rgba(18,21,27,.96);border:1px solid var(--line2);box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:12.5px;line-height:1.45;white-space:nowrap}
#tip[hidden]{display:none}
#tip b{font-weight:600}
#tip .k{color:var(--text3)}
#tip .big{font-size:20px;font-weight:700;line-height:1.1}
#nav{position:absolute;display:flex;gap:4px;padding:4px;border-radius:8px;background:rgba(18,21,27,.9);border:1px solid var(--line2);opacity:0;transition:opacity .15s;z-index:5}
#nav.show{opacity:1}
#nav button{width:28px;height:26px;border-radius:5px;color:var(--text2);font-size:15px}
#nav button:hover{background:var(--hover);color:#fff}
#panel{position:absolute;right:0;top:40px;bottom:0;width:300px;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:12px 14px 20px}
#panel h4{margin:16px 0 8px;font-size:11px;letter-spacing:.6px;font-weight:600;color:var(--text3);text-transform:uppercase}
#panel h4:first-child{margin-top:2px}
.st{font-size:17px;font-weight:600;margin:2px 0 6px}
.kv{display:flex;justify-content:space-between;gap:10px;margin:4px 0;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--text3)}
.kv span:last-child{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.chip{padding:1px 6px;border-radius:4px;background:var(--raised);font-size:12px}
.chip.no{color:var(--text3)}
.grp{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:600}
.grp i{width:10px;height:10px;border-radius:50%}
.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;padding:5px 6px;margin:0 -6px;border-radius:5px;cursor:pointer;font-variant-numeric:tabular-nums}
.row:hover,.row.hl{background:var(--hover)}
.row.pin{background:#232935}
.row .p{font-size:15px;font-weight:700}
.row .bar{height:4px;border-radius:2px;background:var(--line2);position:relative;overflow:hidden}
.row .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.row .w{color:var(--text2);font-size:12px}
.row .where{grid-column:2 / 4;color:var(--text3);font-size:11.5px;margin-top:-3px}
.near{display:flex;gap:10px;color:var(--text2);font-size:12px;margin:6px 0 0;padding:6px 8px;border-radius:6px;background:var(--raised)}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.dirs div{padding:6px 8px;border-radius:6px;background:var(--raised)}
.dirs b{display:block;font-size:17px}
.dirs span{color:var(--text3);font-size:11.5px}
.day{display:grid;grid-template-columns:62px 1fr;gap:3px 8px;font-size:12.5px}
.day b{font-weight:600}
.foot{margin-top:16px;color:var(--text3);font-size:11.5px;line-height:1.5}
.lv{font-variant-numeric:tabular-nums}
.lvrow{display:grid;grid-template-columns:1fr auto 78px;gap:8px;padding:3px 6px;margin:0 -6px;border-radius:4px;font-size:12.5px}
.lvrow span:nth-child(2){color:var(--text2)}
.lvrow span:nth-child(3){text-align:right}
.lvrow i{font-style:normal;font-size:11px}
.lvrow[data-lvl]{cursor:default}
.lvrow[data-lvl]:hover,.lvrow.hl{background:var(--hover)}
.lvrow.now{background:rgba(8,153,129,.14);color:#CFEDE6;font-weight:600}
.next{margin:0;padding:0 0 0 16px;font-size:12.5px;line-height:1.5}
.next li{margin:3px 0}
.next b{font-weight:600}
#menu .mh{padding:8px 8px 3px;margin-top:4px;border-top:1px solid var(--line2);color:var(--text3);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
#nav:hover{opacity:1}
#cfgb{height:28px;padding:0 10px;border-radius:6px;background:var(--raised)}
#cfgb:hover,#cfgb.on{background:var(--hover)}
#cfgp{position:absolute;top:38px;right:180px;width:360px;max-height:calc(100% - 50px);overflow-y:auto;padding:8px 12px 12px;background:#12151B;border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:21}
#cfgp[hidden]{display:none}
#cfgp .ch{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px;border-bottom:1px solid var(--line2)}
#cfgp .ch button{padding:4px 10px;border-radius:5px;background:var(--raised)}
#cfgp .ch button:hover{background:var(--hover)}
#cfgp .cs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 0;color:var(--text3);font-size:12px}
#cfgp .cs button{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:5px;background:var(--raised);color:var(--text2)}
#cfgp .cs button:hover{background:var(--hover);color:#fff}
#cfgp .cs i{width:16px;height:8px;border-radius:2px}
#cfgp .cg{margin:10px 0 4px;color:var(--text3);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
#cfgp .cr{display:grid;grid-template-columns:1fr 120px 30px;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
#cfgp .cr span{color:var(--text2)}
#cfgp .cr input[type=color]{grid-column:2 / 4;width:100%;height:22px;padding:0;border:1px solid var(--line2);border-radius:4px;background:none;cursor:pointer}
#cfgp .cr select{grid-column:2 / 4;background:var(--raised);color:var(--text);border:1px solid var(--line2);border-radius:4px;padding:3px}
#cfgp .cr input[type=range]{width:120px;accent-color:#9AA6B8}
#cfgp .cr em{font-style:normal;color:var(--text3);font-size:11px;text-align:right}
.dim{color:var(--text3)}
/* Design 22: the panel of 21 with a match mark and quiet meanings on hover. */
#dr21-root{position:relative;width:100%;height:100%;--p21-width:292px}
#main{right:var(--p21-width)}
#panel{width:var(--p21-width);padding:12px 12px 12px;font-size:13px;line-height:1.35;color:#D1D4DC}
.p21-empty{color:#98A3B3;padding:8px 2px}
.p21-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;color:#A6AFBC;font-size:12px;font-weight:600;letter-spacing:.2px}
.p21-h span{font-weight:400;color:#7F8896;font-size:11.5px}
.p21-h.second{margin-top:14px;padding-top:10px;border-top:1px solid #252B34}
.p21-link{position:relative;display:flex;align-items:baseline;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums}
.p21-link:hover,.p21-link.on{background:#1C2330}
.p21-link.pinned{background:#243042}
.p21-link .t{flex:1;min-width:0;color:#C9CFD8}
.p21-link .t i{font-style:normal}
.p21-link>b{font-weight:700;white-space:nowrap}
.p21-link>b i{font-style:normal}
.p21-link.dim .t{color:#8F98A6}
.p21-dir{display:flex;align-items:baseline;gap:2px;margin:0 0 2px;color:#C9CFD8;font-size:12.5px;white-space:nowrap}
.p21-dir .lb{flex:1}
.p21-dir .p21-link.in{margin:0;padding:2px 6px}
.p21-no{padding:2px 4px;color:#98A3B3}
.p21-g{display:flex;align-items:center;gap:7px;margin:8px 0 2px;font-size:12px;font-weight:600;color:#C9CFD8}
.p21-g i{width:8px;height:8px;border-radius:50%}
.p21-link.place{display:grid;grid-template-columns:42px 1fr auto 74px;gap:6px;align-items:center;font-size:12.5px;overflow:hidden}
.p21-link.place .bar{position:absolute;left:0;top:0;bottom:0;opacity:.09;border-radius:4px;pointer-events:none}
.p21-link.place .z{color:#9AA4B2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p21-link.place .pr{color:#D1D4DC}
.p21-link.place .tm{color:#AEB7C4;text-align:right}
.p21-link.tgt .tm2,.p21-past{color:#8F98A6;font-size:12px;white-space:nowrap}
.p21-past{margin-left:auto}
.p21-note{color:#8F98A6;font-size:12px;padding:3px 0}
#apibar{display:none;align-items:center;gap:8px;font-size:12px;color:#A3A8B3;white-space:nowrap}
#dr21-root.api #apibar{display:flex}
#dr21-root.api #scene,#dr21-root.api .version21,#dr21-root.api #step21{display:none}
#apibar .err{color:#F28B82;font-weight:600}
#apibar .auto{display:flex;align-items:center;gap:4px;cursor:pointer}
#apibar button{height:26px;padding:0 9px;border-radius:5px;background:#161D26;color:#C9CFD8}
#apibar button:hover{background:#25303B;color:#fff}
#apibar button:disabled{opacity:.5}
#step21{display:flex;gap:2px}
#step21 button,#panel21toggle{padding:5px 7px;background:#161D26;border-radius:4px;color:#B7C1CE;font-size:12px;white-space:nowrap}
#step21 button:hover,#panel21toggle:hover{background:#25303B;color:#fff}
#dr21-root.panel21closed #panel{display:none}
#dr21-root.panel21closed #main{right:0}
#tb .version21{font-size:12px;color:#8C98A9}
#cv{touch-action:none}
@media(max-width:1200px){#dr21-root{--p21-width:268px}#tb{gap:5px}.seg button{padding:0 6px}#date{display:none}}
@media(max-width:950px){#inst .off{display:none}#cfgb{font-size:12px;padding:0 6px}.version21{display:none}#tb .lbl{display:none}#tb{gap:4px}#scene button{font-size:12px}#back{font-size:11px;padding:0 5px}}
@media(max-width:700px){html,body{height:auto;min-height:100%;overflow:auto}#dr21-root{height:1260px!important}#tb{height:90px;flex-wrap:wrap;align-content:center;gap:6px;white-space:normal}#main{top:90px;right:0;height:570px;bottom:auto}#panel{top:660px;left:0;width:100%;bottom:0;border-left:0;border-top:1px solid #252B34;padding:10px 14px}#dr21-root.panel21closed{height:660px!important}#menu,#cfgp{right:5px;top:85px;max-width:calc(100% - 10px)}#clock{margin-left:auto}#step21 button,#panel21toggle{min-height:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.p21-sub{color:#8F98A6;font-size:11.5px}
.p22-match{font-style:normal;margin-left:6px;font-size:12px;cursor:help}.p22-match.m-p25{color:#8FD3BC}.p22-match.m-p50{color:#D8C17E}.p22-match.m-none{color:#E79A94}
.p21-link[title],.p21-h span[title],.p21-note[title],.p21-dir .lb[title]{cursor:help}

</style>

<div id="dr21-root" aria-label="DR Lab — вариант 22">
<div id="tb">
  <div class="seg" id="inst"><button class="on">NQ</button><button class="off" title="В макете только NQ">ES</button><button class="off" title="В макете только NQ">YM</button></div>

    // Design 22: the right panel of design 21 (percentages only, every line a link to the chart), changed by the audit of

  // ---------- what a link shows ----------
  // the densest spot of a place: its densest price step (0.1 IDR) and, in it, the densest time window of the extremes
  function hotOf(ov, R, k) {
    if (!k.all || !k.all.length) return null;
    const cnt = new Map();
    for (const q of k.all) { const b = Math.floor(q.u / 0.1 + 1e-9); cnt.set(b, (cnt.get(b) || 0) + 1); }
    let best = null;
    for (const [b, n] of cnt) if (!best || n > best[1]) best = [b, n];
    const pb = R.pb.find(q => q.b === best[0]);

  // when similar sessions first reached a price after the moment (5-minute bars), and the densest window of it;
  // own = 'H' | 'L': each session's own DR high / low instead of today's price (design 22, before a confirmation)
  function firstTouch(ov, p, own) {

  // ---------- the panel ----------

  function lvlObj(s, id) { return levels(s).find(l => l.id === id); }
  // targets ahead in the direction of the side in play (the next STD steps not yet taken, the session extreme, past
  // sessions' DR, the nearest open VI)
  function targets21(ctx) {
    const s = ctx.s, ov = ctx.ov, side = ov.mode === 'brk' ? s.nside : s.side, w = s.idrH - s.idrL, out = [];
    const ahead = p => side === 1 ? p > s.priceNow + 1e-9 : p < s.priceNow - 1e-9;
    const edge = ov.mode === 'brk' ? s.nedge : s.edge, done = (ov.mode === 'brk' ? s.takenN : s.taken) || [];
    for (let j = 1; j <= 6; j++) { const p = edge + side * j * w / 2; if (ahead(p) && !done.some(q => q.j === j && q.t)) out.push({ p, name: stepName(j, side === 1) }); }
    const bars = ctx.D.bars.filter(b => b.t >= s.start && b.t < Math.min(ctx.obs, s.end) && (ctx.live || b.t + 5 <= ctx.obs));
    if (bars.length) { const e = side === 1 ? Math.max(...bars.map(b => b.h)) : Math.min(...bars.map(b => b.l)); if (ahead(e)) out.push({ p: e, name: side === 1 ? 'максимум сессии' : 'минимум сессии' }); }
    for (const P of prevList(ctx)) { const p = side === 1 ? P.s.drH : P.s.drL; if (ahead(p)) out.push({ p, name: P.name + (side === 1 ? ' DR high' : ' DR low') }); }

    out.sort((a, b) => Math.abs(a.p - s.priceNow) - Math.abs(b.p - s.priceNow));

  if (hp.get('band')) {   // &band=pull:24666 — as if the cursor were on that price in the density column
    const [role, p] = hp.get('band').split(':'), c = cur(), R = c.ov && c.ov.roles.find(r => r.id === role), b = R && (p === 'max' ? R.pb.slice().sort((x, y) => y.pct - x.pct)[0] : R.pb.find(q => +p >= q.pLo && +p < q.pHi));
    if (b) st.hover = { k: 'pband', pLo: b.pLo, pHi: b.pHi, src: 'proj', list: [{ R, b }] };
  }
  if (hp.get('pin')) {
    const [role, rank] = hp.get('pin').split(':'), c = cur(), R = c.ov && c.ov.roles.find(r => r.id === role), k = R && R.cons.find(q => q.rank === +rank);
    if (k) st.pin = { k: 'con', role, id: k.id };
    if (k && hp.get('slice')) { const [a1, b1] = hp.get('slice').split(':').map(Number); st.pin.slice = a1 * 60 + b1; }
  }
  render(true);
})();

</script>
</div>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>DR Lab — три варианта</title>
<style>
:root{
  --bg:#0e1117; --panel:#141821; --chart:#131722; --line:#252b37; --line2:#303746; --hover:#1d2330;
  --tx:#e8eaf0; --tx2:#c9cdd6; --tx3:#a9afbb;
  --up:#26a69a; --dn:#ef5350;
  --c:#c8962c; --c-hi:#f0b547; --p:#2c8fd0; --p-hi:#4db0f5;
  --hi:#8f7bf0; --hi-hi:#ab9bff; --lo:#d4668f; --lo-hi:#f08ab0;
  --sc:#5b6376; --brk:#ef5350;
  --font:-apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.35 var(--font)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column}

/* header */
#hdr{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap}
.brand{font-weight:700;font-size:14px;color:var(--tx);letter-spacing:.02em}
.inst{display:flex;align-items:baseline;gap:8px;font-size:14px}
.inst b{font-weight:700}
.inst .sub{color:var(--tx2);font-size:13px}
.sep{width:1px;height:24px;background:var(--line2)}
.clock{display:flex;align-items:center;gap:8px;font-size:14px}
.clock .live{width:8px;height:8px;border-radius:50%;background:var(--up)}
.replay{display:flex;align-items:center;gap:6px;background:#2a2412;border:1px solid #6b5520;border-radius:4px;padding:3px 4px 3px 8px;font-size:13px;color:#ffe2a8}
.replay button{padding:2px 8px;border-radius:3px;color:var(--tx);font-size:12px;background:#3a3218}
.replay button:hover{background:#4a4020}
.replay button.on{background:#6b5520}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:4px;border:1px solid var(--line2);background:#181d27;font-size:13px;color:var(--tx);cursor:default}
.chip .dot{width:9px;height:9px;border-radius:2px}
.chip.brk{border-color:#8a2f33;background:#2a1417;color:#ffd6d3}
.chip.ok{border-color:#2e5a55;background:#12211f}
.chip.n{cursor:help}
.chip.n:hover,.chip.n.hl{border-color:#6d7686;background:var(--hover)}
.grow{flex:1}
.seg{display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{padding:5px 11px;font-size:13px;color:var(--tx2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover);color:var(--tx)}
.seg button.on{background:#2a3242;color:#fff;font-weight:700}
.seg .k{color:var(--tx3);font-weight:400;margin-right:5px}
.seglab{font-size:12px;color:var(--tx3);margin-right:-6px}

/* main */
#main{flex:1;display:flex;min-height:0}
#chartWrap{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--chart)}
#cv{display:block;cursor:crosshair}
#cv.drag{cursor:grabbing}
#panel{width:392px;flex:0 0 392px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}

/* panel */
.psec{padding:12px 14px 12px;border-bottom:1px solid var(--line)}
.psec:last-child{border-bottom:0}
.ptitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tx);margin-bottom:8px}
.ptitle .r{margin-left:auto;font-weight:400;color:var(--tx2)}
.kv{display:grid;grid-template-columns:104px 1fr;row-gap:4px;column-gap:8px;font-size:13px}
.kv .k{color:var(--tx2)}
.kv .v{color:var(--tx);font-variant-numeric:tabular-nums}
.kv .v .m{color:var(--tx2)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:inline-flex;gap:5px;align-items:center;padding:1px 6px;border-radius:3px;background:#1c222d;border:1px solid var(--line2);font-size:12px}
.step.no{color:var(--tx3);border-style:dashed}
.step b{font-weight:700}
.hlrow{border-radius:3px}
.hov{cursor:default}
.hov:hover,.hov.hl{background:var(--hover)}

/* composition + list */
.comp{display:flex;height:12px;gap:2px;margin:2px 0 8px}
.comp i{display:block;height:100%;border-radius:2px;min-width:2px}
.comp i.hl{outline:2px solid #fff;outline-offset:0}
.plist{display:flex;flex-direction:column;gap:1px;margin-bottom:10px}
.prow{display:grid;grid-template-columns:16px 21px 48px 68px 1fr 78px;align-items:center;height:25px;padding:0 4px;border-radius:3px;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer}
.prow:hover,.prow.hl{background:var(--hover)}
.prow.pin{background:#262e3d;box-shadow:inset 2px 0 0 #fff}
.prow .rk{font-size:12px;color:var(--tx2);text-align:center}
.prow .sh{font-weight:700;color:#fff}
.prow .kn{color:var(--tx2);font-size:12px}
.prow .pr{color:var(--tx);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tw{color:var(--tx2);font-size:12px;text-align:right}
.prow.weak .sh{font-weight:400;color:var(--tx2)}
.prow.weak .pr,.prow.weak .tw{color:var(--tx3)}
.prow.rest{cursor:default;color:var(--tx3);font-size:12px}
.prow.rest:hover{background:none}
.rolehead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:2px 0 4px}
.rolehead .n{margin-left:auto;font-weight:400;font-size:12px;color:var(--tx2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.outc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.outc .o{border:1px solid var(--line2);border-radius:4px;padding:4px 7px;cursor:default}
.outc .o:hover,.outc .o.hl{background:var(--hover)}
.outc .o b{font-size:14px;color:#fff}
.outc .o .l{font-size:12px;color:var(--tx2)}
.outc .o .kn{font-size:12px;color:var(--tx2)}

/* day structure */
.mdl{display:grid;grid-template-columns:52px 1fr 1fr;gap:3px 8px;font-size:13px;margin-top:8px}
.mdl .h{font-size:12px;color:var(--tx2)}
.mdl .c{padding:1px 4px;border-radius:3px}
.mdl .ok{color:#9fe0d8}
.mdl .br{color:#ffb4ae}
.struct svg{display:block}

/* board */
#board{position:relative;flex:0 0 auto;border-top:1px solid var(--line);background:#12161f;overflow:hidden}
.bgrid{position:absolute;inset:0;pointer-events:none}
.bgrid i{position:absolute;top:0;bottom:0;width:1px;background:#1c212c}
.bgrid i.now{background:#6f7788}
.bgrid i.end{background:#3b4252}
.bsec{position:relative}
.bhead{position:relative;height:26px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:13px;font-weight:700;background:#161b25;border-bottom:1px solid var(--line)}
.bhead .n{font-weight:400;color:var(--tx2);font-size:12px}
.bhead .comp{width:260px;margin:0}
.brow{position:relative;display:flex;align-items:center;border-bottom:1px solid #1a1f29;cursor:pointer}
.brow:hover,.brow.hl{background:rgba(255,255,255,.04)}
.brow.pin{background:rgba(255,255,255,.07);box-shadow:inset 3px 0 0 #fff}
.btext{position:relative;z-index:2;display:grid;align-items:center;height:100%;padding:0 12px;background:#12161f;font-variant-numeric:tabular-nums;white-space:nowrap}
.brow:hover .btext,.brow.hl .btext{background:#181d27}
.brow.pin .btext{background:#1d2330}
.btext .rk{font-size:13px;color:var(--tx2);text-align:center}
.btext .sh{font-weight:700;font-size:14px;color:#fff}
.btext .kn{font-size:12px;color:var(--tx2)}
.btext .pr{font-size:13px;color:var(--tx)}
.btext .wh{font-size:12px;color:var(--tx2)}
.btext .tw{font-size:13px;color:var(--tx)}
.brow.weak .sh{font-weight:400;font-size:13px;color:var(--tx2)}
.brow.weak .pr,.brow.weak .tw{color:var(--tx2)}
.bbar{position:absolute;z-index:1;border-radius:3px}
.sbar{display:block;height:10px;margin-right:14px;background:#1f2530;border-radius:2px;position:relative}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.mdl .h{padding:0 4px}
.brest{display:flex;align-items:center;gap:8px;height:26px;padding:0 12px;font-size:12px;color:var(--tx2);border-bottom:1px solid #1a1f29;position:relative;z-index:2;background:#12161f;width:max-content;min-width:100%}
.brest .wchip{padding:1px 7px;border-radius:3px;border:1px dashed #4a5263;color:var(--tx2);cursor:pointer}
.brest .wchip:hover,.brest .wchip.hl{background:var(--hover);color:var(--tx)}
.bempty{padding:14px 16px;color:var(--tx2);font-size:13px}

/* cards */
.card{position:absolute;z-index:50;min-width:260px;max-width:340px;background:#1b2130;border:1px solid #3a4356;border-radius:6px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:13px;color:var(--tx);pointer-events:none;display:none}
.card.pinned{pointer-events:auto;border-color:#8d97ab}
.card .ch{display:flex;align-items:center;gap:7px;font-weight:700;margin-bottom:6px}
.card .ch .x{margin-left:auto;font-weight:400;color:var(--tx2);cursor:pointer;padding:0 4px}
.card .cbig{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.card .cbig b{font-size:14px}
.card .cbig span{color:var(--tx2);font-size:13px}
.card table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.card td{padding:2px 0;vertical-align:top;font-size:13px}
.card td:first-child{color:var(--tx2);width:62px;padding-right:8px}
.card .cdef{margin-top:7px;padding-top:7px;border-top:1px solid #333b4c;color:var(--tx2);font-size:12px;line-height:1.4}
.card .tier{font-weight:400;font-size:12px;padding:0 6px;border-radius:3px;border:1px solid #4a5366;color:var(--tx2)}
.card .tier.t-strong{color:#fff;border-color:#9aa3b5}
.card .ep{display:grid;grid-template-columns:62px 40px 1fr;gap:1px 8px;font-size:12px}
.card .ep .l{color:var(--tx2)}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="main">
    <section id="chartWrap"><canvas id="cv"></canvas><div id="board"></div></section>
    <aside id="panel"></aside>
  </div>
  <div id="card" class="card"></div>
  <div id="pcard" class="card pinned"></div>
</div>

      const o = pick(r, [pUp, pDn, 1 - pUp - pDn]);
      let hi, lo, out, ot = null;
      const near = (s) => ({ t: tNear(), x: u + s * Math.abs(0.03 + normal(r) * 0.035) });

}

// ---------- clusters on the time x price grid ----------
// points: [{t, x, sid}], t = bar-open minute, x = frame coord. Region = rectangle of cells (15 min x 0.1 W).
function findClusters(points, opt) {
  const { m, E, N } = opt;
  const TB = opt.tb || 15, PB = 0.1;
  const t0 = Math.floor(m / TB) * TB, nT = Math.ceil((E - t0) / TB);
  let pmin = Infinity, pmax = -Infinity;

  const nP = pmax - pmin + 1;
  const Gd = Array.from({ length: nT }, () => new Float64Array(nP));
  for (const q of points) Gd[q._ti][q._pi - pmin]++;
  const K = [[0.5, 1, 0.5]];
  const S = Array.from({ length: nT }, () => new Float64Array(nP));
  for (let i = 0; i < nT; i++) for (let j = 0; j < nP; j++) {
    let s = 0;
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
      const a = i + di, b = j + dj; if (a < 0 || b < 0 || a >= nT || b >= nP) continue;
      s += Gd[a][b] * [0.5, 1, 0.5][di + 1] * [0.55, 1, 0.55][dj + 1];
    }
    S[i][j] = s;
  }
  // watershed: every occupied cell climbs to its local maximum of the smoothed density
  const lab = Array.from({ length: nT }, () => new Int32Array(nP).fill(-1));
  const peakOf = (i, j) => {
    let ci = i, cj = j;
    for (let g = 0; g < 200; g++) {
      let bi = ci, bj = cj, bv = S[ci][cj];
      for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
        const a = ci + di, b = cj + dj; if (a < 0 || b < 0 || a >= nT || b >= nP) continue;
        if (S[a][b] > bv + 1e-12) { bv = S[a][b]; bi = a; bj = b; }
      }
      if (bi === ci && bj === cj) return ci * nP + cj;
      ci = bi; cj = bj;
    }
    return ci * nP + cj;
  };
  const peaks = new Map();
  for (let i = 0; i < nT; i++) for (let j = 0; j < nP; j++) {
    if (S[i][j] <= 0) continue;
    const pk = peakOf(i, j); lab[i][j] = pk;
    if (!peaks.has(pk)) peaks.set(pk, { pk, i: Math.floor(pk / nP), j: pk % nP, s: S[Math.floor(pk / nP)][pk % nP], cells: [] });
    peaks.get(pk).cells.push([i, j]);
  }
  const minPeak = Math.max(2.5, N * 0.009);
  const cand = [...peaks.values()].filter(p => p.s >= minPeak).sort((a, b) => b.s - a.s);
  const clusters = [];
  const taken = Array.from({ length: nT }, () => new Uint8Array(nP));
  const cntRect = (r0, r1, c0, c1) => { let s = 0; for (let i = r0; i <= r1; i++) for (let j = c0; j <= c1; j++) s += Gd[i][j]; return s; };
  const freeRect = (r0, r1, c0, c1) => { for (let i = r0; i <= r1; i++) for (let j = c0; j <= c1; j++) if (taken[i][j]) return false; return true; };
  for (const p of cand) {
    const core = p.cells.filter(([i, j]) => S[i][j] >= 0.42 * p.s && Gd[i][j] > 0);
    if (!core.length) continue;
    let r0 = Math.min(...core.map(c => c[0])), r1 = Math.max(...core.map(c => c[0]));
    let c0 = Math.min(...core.map(c => c[1])), c1 = Math.max(...core.map(c => c[1]));
    // cap the size (6 time bins = 90 min, 5 price bins = 0.5 W): drop the side that loses fewest points
    while (r1 - r0 + 1 > 6) { if (cntRect(r0, r0, c0, c1) <= cntRect(r1, r1, c0, c1)) r0++; else r1--; }
    while (c1 - c0 + 1 > 5) { if (cntRect(r0, r1, c0, c0) <= cntRect(r0, r1, c1, c1)) c0++; else c1--; }
    // trim until the rectangle does not overlap earlier clusters (drop the side that loses the fewest points)
    let guard = 0;
    while (!freeRect(r0, r1, c0, c1) && guard++ < 60) {
      const opts = [];
      if (r1 > r0) { opts.push([r0 + 1, r1, c0, c1]); opts.push([r0, r1 - 1, c0, c1]); }
      if (c1 > c0) { opts.push([r0, r1, c0 + 1, c1]); opts.push([r0, r1, c0, c1 - 1]); }
      if (!opts.length) { r0 = -1; break; }
      opts.sort((a, b) => (freeRect(...b) - freeRect(...a)) || (cntRect(...b) - cntRect(...a)));
      [r0, r1, c0, c1] = opts[0];
    }
    if (r0 < 0 || !freeRect(r0, r1, c0, c1)) continue;
    const k = cntRect(r0, r1, c0, c1);

    clusters.push({ ta, tb, xa: (c0 + pmin) * PB, xb: (c1 + pmin + 1) * PB, k, ti: [r0, r1], pi: [c0 + pmin, c1 + pmin] });
    if (clusters.length >= 7) break;
  }
  // members & epochs
  for (const c of clusters) {
    c.members = points.filter(q => q._ti >= c.ti[0] && q._ti <= c.ti[1] && q._pi >= c.pi[0] && q._pi <= c.pi[1]);
    c.k = c.members.length;
  }
  clusters.sort((a, b) => b.k - a.k);
  return { clusters, grid: { t0, TB, PB, nT, nP, pmin, G: Gd } };
}

function epochStats(sessions, members) {
  return EPOCHS.map(e => {
    const n = sessions.filter(s => s.year >= e.from && s.year <= e.to).length;
    const k = members.filter(q => q.year >= e.from && q.year <= e.to).length;
    return { key: e.key, label: e.label, n, k, s: n ? k / n : 0 };
  });
}

// display tiers (a design rule, not a probability). Thresholds are for the operator to decide.
const TIER_RULE = { strongShare: 0.15, strongK: 25, notableShare: 0.06, notableK: 12, epochFrac: 0.5 };
function tierOf(c, N) {
  const s = c.k / N;
  const stable = c.epochs.every(e => e.s >= TIER_RULE.epochFrac * s);
  c.stable = stable;
  if (s >= TIER_RULE.strongShare && c.k >= TIER_RULE.strongK && stable) return 'strong';
  if (s >= TIER_RULE.notableShare && c.k >= TIER_RULE.notableK) return 'notable';
  return 'weak';
}

// full analysis at moment m for a day
function analyze(day, m) {

  out.F = F; out.phase = F.phase;
  if (!S.traded && (F.phase === 'pre' || F.phase === 'conf' || F.phase === 'broken')) { out.phase = 'untraded'; return out; }
  if (!['pre', 'conf', 'broken'].includes(F.phase)) return out;
  const B = F.box;

    const sessions = simulate({ state: 'pre', m, E, u, N, seedKey, dh: (B.drh - B.idrh) / B.w, dl: (B.idrl - B.drl) / B.w, color: B.color });
    out.sessions = sessions; out.u = u;
    out.frame = { toX: p => (p - B.idrh) / B.w, toP: x => B.idrh + x * B.w, dir: 'up' };
    const nUp = sessions.filter(s => s.out === 'up').length, nDn = sessions.filter(s => s.out === 'down').length;
    out.outcomes = [{ key: 'up', k: nUp }, { key: 'down', k: nDn }, { key: 'none', k: N - nUp - nDn }];
    out.roles = [roleBlock('hi', 'Верх', sessions, s => s.hi, m, E, N), roleBlock('lo', 'Низ', sessions, s => s.lo, m, E, N)];
  } else {
    const dir = F.dir;
    const u = F.u;
    const drExt = dir === 'down' ? (B.idrl - B.drl) / B.w : (B.drh - B.idrh) / B.w;
    const drOpp = dir === 'down' ? (B.drh - B.idrh) / B.w : (B.idrl - B.drl) / B.w;
    const sessions = simulate({ state: F.phase, m, E, u, N, seedKey, drExt, drOpp, extSoFar: F.extSoFar ? F.extSoFar.x : null });
    out.sessions = sessions; out.u = u;
    out.frame = { toX: F.toX, toP: F.toP, dir };
    out.roles = [roleBlock('c', 'Продолжение', sessions, s => s.c, m, E, N), roleBlock('p', 'Откат', sessions, s => s.p, m, E, N)];
  }

}

function roleBlock(key, name, sessions, get, m, E, N) {
  const pts = sessions.map(s => { const e = get(s); return { t: e.t, x: e.x, sid: s.id, year: s.year }; });
  const { clusters, grid } = findClusters(pts, { m, E, N });
  let idx = 0;
  const kept = [];
  for (const c of clusters) {
    c.epochs = epochStats(sessions, c.members);
    c.tier = tierOf(c, N);
    c.share = c.k / N;
    kept.push(c);
  }
  kept.sort((a, b) => b.k - a.k);
  kept.forEach(c => { c.id = key + (++idx); c.rank = idx; c.role = key; });
  const inCl = new Set(); kept.forEach(c => c.members.forEach(q => inCl.add(q.sid)));

  for (let i = 0; i < keep.length; i++) { if (i && keep[i].y < keep[i - 1].y + keep[i - 1].h + 4) keep[i].y = keep[i - 1].y + keep[i - 1].h + 4; if (keep[i].y < minY) keep[i].y = minY; }
  for (let i = keep.length - 1; i >= 0; i--) { const lim = i === keep.length - 1 ? maxY : keep[i + 1].y - 4; if (keep[i].y + keep[i].h > lim) keep[i].y = lim - keep[i].h; }
  return keep;
}

function tierWhy(c) {

  const weakEp = c.epochs.filter(e => e.s < T.epochFrac * s);
  if (weakEp.length) fails.push(`в ${weakEp.map(e => e.label).join(', ')} доля ${weakEp.map(e => pct(e.s)).join(', ')} < половины общей`);
  const rule = `Сильное — доля ≥ ${Math.round(T.strongShare * 100)}${NB}%, сессий ≥ ${T.strongK} и в каждой эпохе доля ≥ половины общей. Заметное — ≥ ${Math.round(T.notableShare * 100)}${NB}% и ≥ ${T.notableK} сессий.`;
  if (c.tier === 'strong') return rule + ' Здесь выполнено всё.';
  return rule + ' Здесь: ' + fails.join('; ') + '.';
}
function clusterCard(c) {

  h += `<div class="cdef">У ${c.k} из ${N} похожих сессий ${roleDef(c.role)} остатка сессии (${hhmm(AN.m)}–${hhmm(AN.S.end)}) оказалась в этой цене и в это время. Не частота посещения и не прогноз; порядок отката и продолжения не задан.</div>`;

function nCard() {
  const a = AN, F = a.F; const S = a.S;

  else {
    cond.push(`подтверждение ${F.conf.dir === 'up' ? '↑' : '↓'} в ${hhmm(F.conf.t - 15)}–${hhmm(F.conf.t + 15)}`);
    cond.push(a.phase === 'broken' ? `слом DR уже был к ${hhmm(a.m)}` : `DR цел на ${hhmm(a.m)}`);
  }
  const u = a.u; const tol = a.tol;
  cond.push(`цена сейчас ${a.phase === 'broken' ? 'в сторону слома ' : ''}${f2(u)} W от ${a.phase === 'broken' ? 'IDR low' : 'IDR high'} (±${f2(tol)})`);
  let h = `<div class="ch">Похожие сессии<span class="tier t-strong">${a.N}</span></div><table>`;
  h += cond.map((c, i) => `<tr><td>${i === 0 ? 'Условия' : ''}</td><td>${esc(c)}</td></tr>`).join('');
  h += `<tr><td>Эпохи</td><td>${eps.map(x => x.e.label + ': ' + x.n).join(' · ')}</td></tr>`;
  h += `<tr><td>Пересчёт</td><td>на закрытии M5 ${hhmm(a.m)}</td></tr></table>`;
  h += `<div class="cdef">Для каждой похожей сессии берутся два экстремума остатка сессии (${hhmm(a.m)}–${hhmm(S.end)}) и их время: ${a.phase === 'pre' ? 'верхний и нижний' : 'откат и продолжение'}. Место — область «15 мин × 0,1 W»; доля места = k из N.</div>`;

function levelCard(t) {

  if (t.std || ['lvl-drh', 'lvl-drl', 'lvl-idrh', 'lvl-idrl', 'lvl-mid'].includes(t.id)) {

function sessionDotCard(roleKey, sid) {

function cellCard(hv) {

function binCard(role, i) {

function placeCard(el, x, y, above) {

// ---------------- render ----------------
function render(full) {
  if (full) { renderHeader(); layout(); }
  autoscale();
  drawChart();

}
function syncDom() {
  document.querySelectorAll('[data-id]').forEach(el => { const id = el.getAttribute('data-id'); el.classList.toggle('hl', isHot(id)); el.classList.toggle('pin', !!(st.pin && st.pin.id === id && el.classList.contains('prow'))); });

  document.querySelectorAll('[data-ses]').forEach(el => { const r = el.querySelector('rect'); if (r) r.setAttribute('fill', hotSession() === el.getAttribute('data-ses') ? '#1d2330' : 'transparent'); });
}
function fullReset() { st.view = null; st.yShift = 0; st.pin = null; st.hover = null; layout(); st.view = defaultView(); render(true); }

// ---------------- events ----------------
function hitTest(mx, my) {
  // swarm dots
  if (st.v === 'swarm' && AN.roles && mx > X(AN.m) - 4 && mx < CH.plotX + CH.plotW && my > CH.plotY && my < CH.plotY + CH.plotH) {
    let best = null, bd = 30;
    for (const R of AN.roles) for (const q of R.pts) { const x = X(q.t + 2.5 + (AN.sessions[q.sid].jit - 0.5) * 3.8), y = Y(q.p); const d = (x - mx) ** 2 + (y - my) ** 2; if (d < bd) { bd = d; best = { type: 'dot', role: R.key, sid: q.sid, id: 'dot' + R.key + q.sid }; } }
    const labelHit = HIT.filter(h => h.type === 'cluster' && h.prio === 5 && inBox(h.box, mx, my));
    if (labelHit.length) return { type: 'cluster', id: labelHit[0].id };
    if (best && bd < 16) return best;
  }
  const hits = HIT.filter(h => h.box && inBox(h.box, mx, my)).sort((a, b) => (b.prio || 0) - (a.prio || 0));
  if (hits.length) {
    const h = hits[0];
    if (h.type === 'cluster') return { type: 'cluster', id: h.id };
    if (h.type === 'bin') return { type: 'bin', role: h.role, bin: h.bin, id: 'bin' + h.role + h.bin };
    if (h.type === 'tag') return { type: 'tag', t: h.t, id: h.t.id };
    if (h.type === 'marker') return { type: 'marker', kind: h.kind, id: 'mk' + h.kind };
  }
  // cell in the remaining-session field (swarm)
  if (st.v === 'swarm' && AN.roles && mx > X(AN.m) && mx < Math.min(CH.plotX + CH.plotW, X(AN.S.end)) && my > CH.plotY && my < CH.plotY + CH.plotH) {
    const t = Tm(mx); const tb0 = Math.floor(t / 15) * 15; const ta = Math.max(AN.m, tb0), tb = Math.min(AN.S.end, tb0 + 15);
    const x = AN.frame.toX(Pr(my)); const xa = Math.floor(x / 0.1 + 1e-9) * 0.1, xb = xa + 0.1;
    return { type: 'cell', ta, tb, xa, xb, pa: AN.frame.toP(xa), pb: AN.frame.toP(xb), id: 'cell' + ta + '_' + xa.toFixed(1) };
  }
  // candle
  if (mx >= CH.plotX && mx < CH.plotX + CH.plotW && my > CH.plotY && my < CH.plotY + CH.plotH) {
    const t = Math.floor(Tm(mx) / 5) * 5; const b = DAYS[st.day].bars.find(x => x[0] === t);
    const visible = b && (st.replay ? (b[0] + 5 <= st.m || st.ghost) : true);
    if (visible) return { type: 'candle', bar: t, id: 'bar' + t };
  }
  return null;
}
function inBox(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

function onMove(e) {
  const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top;
  const inPlot = mx >= CH.plotX && mx < CH.plotX + CH.plotW && my >= CH.plotY && my < CH.plotY + CH.plotH;
  st.mouse = { x: mx, y: my, inPlot };
  if (st.drag) {
    const dx = mx - st.drag.x, dy = my - st.drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) st.drag.moved = true;
    if (st.drag.moved) {
      const span = st.drag.t1 - st.drag.t0; const dt = -dx / CH.plotW * span;
      st.view = clampView(st.drag.t0 + dt, st.drag.t1 + dt);
      st.yShift = st.drag.ys + dy / CH.plotH * (st.py.max - st.py.min);
      cv.classList.add('drag');
      render(false); return;
    }
  }
  const h = hitTest(mx, my);
  const prev = st.hover;
  st.hover = h ? Object.assign(h, { cx: e.clientX, cy: e.clientY }) : null;
  if ((prev && prev.type === 'cluster') !== (h && h.type === 'cluster') || (prev && h && prev.id !== h.id)) st._panelDirty = false;
  render(false);
}
function clampView(t0, t1) {
  const span = t1 - t0, lo = -420, hi = 1000;
  if (t0 < lo) { t0 = lo; t1 = lo + span; }
  if (t1 > hi) { t1 = hi; t0 = hi - span; }
  return { t0, t1 };
}
function onDown(e) { const r = cv.getBoundingClientRect(); st.drag = { x: e.clientX - r.left, y: e.clientY - r.top, t0: st.view.t0, t1: st.view.t1, ys: st.yShift, moved: false }; }
function onUp(e) {
  const d = st.drag; st.drag = null; cv.classList.remove('drag');
  if (!d || d.moved) return;
  const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top;
  const h = hitTest(mx, my);
  if (h && h.type === 'cluster') { togglePin({ type: 'cluster', id: h.id }, e.clientX, e.clientY); return; }
  if (h && (h.type === 'marker' || h.type === 'tag' || h.type === 'dot' || h.type === 'cell' || h.type === 'bin')) { togglePin(Object.assign({}, h), e.clientX, e.clientY); return; }
  if (h && h.type === 'candle') { replayAt(h.bar + 5); return; }

}
function togglePin(o, cx, cy) {
  if (st.pin && st.pin.id === o.id) st.pin = null; else st.pin = Object.assign(o, { cx, cy });
  st.hover = null; render(true);
}
function replayAt(m) {
  const now = DAYS[st.day].now;
  if (st.replay && st.m === m) { goNow(); return; }
  if (!st.replay && m >= Math.floor(now / 5) * 5 + 5) { return; }
  const keepView = st.view;
  load(st.day, m, true); st.pin = null; st.hover = null; st.s = matchPreset();
  layout(); st.view = st.v === 'swarm' ? keepView : defaultView(); render(true);
}
function goNow() { load(st.day, DAYS[st.day].now, false); st.s = matchPreset(); st.pin = null; st.hover = null; layout(); st.view = defaultView(); st.yShift = 0; render(true); }
function matchPreset() { for (const k of Object.keys(PRESETS)) if (isPreset(k)) return k; return st.s; }
function onWheel(e) {
  e.preventDefault();
  const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left;
  const t = Tm(Math.max(CH.plotX, Math.min(CH.plotX + CH.plotW, mx)));
  const f = Math.exp(e.deltaY * 0.0015);
  let span = (st.view.t1 - st.view.t0) * f; span = Math.max(30, Math.min(1500, span));
  const a = (t - st.view.t0) / (st.view.t1 - st.view.t0);
  st.view = clampView(t - a * span, t - a * span + span);
  render(false);
}

function bindDom() {
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mousedown', onDown);
  window.addEventListener('mouseup', onUp);
  cv.addEventListener('wheel', onWheel, { passive: false });
  cv.addEventListener('dblclick', () => { st.view = defaultView(); st.yShift = 0; render(false); });
  cv.addEventListener('mouseleave', () => { st.mouse = null; if (!st.drag) { st.hover = null; render(false); } });
  document.addEventListener('mouseover', (e) => {
    if (e.target === cv) return;
    const el = e.target.closest('[data-id],[data-oid],[data-ses],[data-mid],[data-ncard]');
    let h = null;
    if (el) {
      if (el.hasAttribute('data-id')) h = { type: 'cluster', id: el.getAttribute('data-id') };
      else if (el.hasAttribute('data-oid')) h = { type: 'outcome', id: el.getAttribute('data-oid') };
      else if (el.hasAttribute('data-ses')) h = { type: 'session', id: el.getAttribute('data-ses') };
      else if (el.hasAttribute('data-mid')) h = { type: 'model', id: el.getAttribute('data-mid') };
      else if (el.hasAttribute('data-ncard')) h = { type: 'ncard', id: 'ncard' };
      const r = el.getBoundingClientRect();
      h.cx = h.type === 'cluster' && el.closest('#panel') ? r.left - 380 : (el.closest('#board') ? e.clientX : r.left); h.cy = el.closest('#board') ? r.top - 10 : r.bottom - 8;
      if (h.type === 'cluster' && el.closest('#panel')) h.cx = r.left - 372;
      if (h.type === 'ncard') { h.cx = r.left - 10; h.cy = r.bottom + 2; }
      if (h.type === 'session' || h.type === 'model') { h.cx = r.left - 372; h.cy = r.top - 20; }
      if (el.closest('#board')) { h.cx = Math.max(360, X(AN.m) - 12); h.cy = $('#board').getBoundingClientRect().top - 8; h.above = true; }
    }
    const same = (st.hover && h && st.hover.id === h.id) || (!st.hover && !h);
    if (same) return;
    if (!h && st.hover && st.mouse) return;
    st.hover = h; render(false);
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button,[data-act],[data-expand]');
    if (b) {
      if (b.dataset.v) { st.v = b.dataset.v; fullReset(); setHash(); return; }
      if (b.dataset.s) { applyPreset(b.dataset.s); setHash(); return; }
      if (b.dataset.act === 'now') { goNow(); return; }
      if (b.dataset.act === 'ghost') { st.ghost = !st.ghost; render(true); return; }
      if (b.dataset.act === 'unpin') { st.pin = null; render(true); return; }
      if (b.dataset.expand) { st.expand[b.dataset.expand] = !st.expand[b.dataset.expand]; layout(); render(true); return; }
    }
    if (e.target === cv) return;
    const el = e.target.closest('[data-id]');
    if (el) {
      const r = el.getBoundingClientRect();
      if (el.closest('#board')) togglePin({ type: 'cluster', id: el.dataset.id, above: true }, Math.max(360, X(AN.m) - 12), $('#board').getBoundingClientRect().top - 8);
      else togglePin({ type: 'cluster', id: el.dataset.id }, el.closest('#panel') ? r.left - 372 : e.clientX, r.top);
    }
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (st.pin) { st.pin = null; render(true); } else if (st.replay) goNow(); }
    if (e.key === '1' || e.key === '2' || e.key === '3') { st.v = Object.keys(VARIANTS)[+e.key - 1]; fullReset(); setHash(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const now = Math.floor(DAYS[st.day].now / 5) * 5; let m = st.replay ? st.m : now;
      m += e.key === 'ArrowLeft' ? -5 : 5;
      if (m >= now + 5) { goNow(); return; }
      if (m < -355) return;
      load(st.day, m, true); st.s = matchPreset(); st.pin = null; render(true);
    }
  });
  window.addEventListener('resize', () => { layout(); render(true); });
}
function applyPreset(k) {
  const p = PRESETS[k]; st.s = k; st.ghost = false; st.expand = {};
  load(p.day, p.m == null ? DAYS[p.day].now : p.m, p.m != null);
  st.pin = null; st.hover = null; st.yShift = 0; layout(); st.view = defaultView(); render(true);
}
function setHash() { try { history.replaceState(null, '', '#v=' + st.v + '&s=' + st.s); } catch (e) { } }
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('v') && VARIANTS[q.get('v')]) st.v = q.get('v');
  if (q.get('s') && PRESETS[q.get('s')]) st.s = q.get('s');
  return q;
}

// ---------------- boot ----------------
bindDom();
const q = readHash();
applyPreset(st.s);
if (q.get('pin')) {
  const id = q.get('pin');
  if (AN.cl[id]) { st.pin = { type: 'cluster', id, cx: +(q.get('px') || 700), cy: +(q.get('py') || 300) }; render(true); }
  if (id === 'n') { st.hover = { type: 'ncard', id: 'ncard', cx: 700, cy: 60 }; render(false); }
}
if (q.get('m')) {
  const [hh, mi] = q.get('m').split(':').map(Number); let mm = hh * 60 + mi; if (hh >= 18) mm -= 1440;
  load(st.day, mm, true); st.s = matchPreset(); layout(); st.view = defaultView(); render(true);
}
if (q.get('ghost')) { st.ghost = true; render(true); }
if (q.get('expand')) { st.expand[q.get('expand')] = true; layout(); render(true); }
// test hook: #...&sim=move:x,y;click:x,y;wheel:x,y,dy;drag:x1,y1,x2,y2;over:#selector  (dispatches real events)
if (q.get('sim')) { $('#app').style.cssText = 'width:1920px;height:1000px'; layout(); render(true); }
if (q.get('sim')) setTimeout(() => {
  const ev = (type, x, y, extra) => { const t = document.elementFromPoint(x, y) || cv; t.dispatchEvent(new MouseEvent(type, Object.assign({ bubbles: true, clientX: x, clientY: y }, extra || {}))); };
  for (const step of q.get('sim').split(';')) {
    const [k, a] = step.split(':'); const n = (a || '').split(',').map(Number);
    if (k === 'move') ev('mousemove', n[0], n[1]);
    if (k === 'click') { ev('mousedown', n[0], n[1]); ev('mouseup', n[0], n[1]); ev('click', n[0], n[1]); }
    if (k === 'wheel') { const t = document.elementFromPoint(n[0], n[1]); t.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, clientX: n[0], clientY: n[1], deltaY: n[2] })); }
    if (k === 'drag') { ev('mousedown', n[0], n[1]); for (let i = 1; i <= 5; i++) ev('mousemove', n[0] + (n[2] - n[0]) * i / 5, n[1] + (n[3] - n[1]) * i / 5); ev('mouseup', n[2], n[3]); }
    if (k === 'over') { const el = document.querySelector(a); if (el) { const r = el.getBoundingClientRect(); el.dispatchEvent(new MouseEvent('mouseover', { bubbles: true, clientX: r.left + 20, clientY: r.top + 5 })); } }
  }
}, 400);
window.__st = st; window.__AN = () => AN;
})();

</script>
